<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Manoj Interior Studio</title>
<style>
:root{--b1:#1e3c72;--b2:#2a5298;--blue:#2458d3;--ink:#16213a;--mut:#66748b;--line:#d6e2f5;--bg:#f2f5fb;--err:#d92d20;--warn:#d97706;--info:#2563eb;--ok:#059669}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:58px}
header .brand{flex:1;min-width:170px}header h1{margin:0;font-size:17px;letter-spacing:.2px}header .sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn,.hsel{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.hsel option{color:#111}
.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100vh - 58px)}
.vp{position:relative;min-height:0;background:#e9eef6;overflow:hidden}
#view{position:absolute;inset:0}#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap;color:#1e3a8a}
.lbl.wall{background:var(--b1);color:#fff;border:0;font-weight:700}
.lbl.sel{background:var(--blue);color:#fff;border:0;font-weight:600}
.lbl.feat{background:#fff7e6;color:#92400e;border-color:#fcd9a0}
.lbl.svc{background:#101828;color:#fff;border:0;font-weight:700;font-size:10px;padding:0 6px}
.vtools{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
.vtools>*{pointer-events:auto}
.vbadge{position:absolute;left:8px;bottom:8px;display:flex;gap:5px;pointer-events:auto}
.pill{border:1px solid var(--line);background:#fff;color:#1e3a8a;border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill:disabled{opacity:.45}
.panel{overflow:auto;border-left:1px solid var(--line);background:var(--bg);padding-bottom:40px}
.tabs{display:flex;gap:6px;padding:9px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);overflow-x:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px;box-shadow:0 1px 3px rgba(30,60,114,.06)}
.card h3{margin:0 0 8px;font-size:14px;color:var(--b1);display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h4{margin:10px 0 6px;font-size:13px;color:#334}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px}.f .u{color:#94a3b8;font-weight:600}
.in{width:100%;border:1px solid #c9d6ee;border-radius:999px;padding:7px 12px;font:inherit;background:#fff;color:var(--ink);min-width:0}
textarea.in{border-radius:12px;resize:vertical}
.in:focus{outline:2px solid #bcd0fb;border-color:var(--blue)}
.in.bad{border-color:var(--err);background:#fff1f0}
.hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.btn{border:0;border-radius:999px;padding:8px 14px;background:linear-gradient(135deg,var(--b2),var(--blue));color:#fff;font:inherit;font-weight:650;font-size:13px;cursor:pointer}
.btn.sec{background:#e8eefb;color:#1e3a8a}.btn.dan{background:#b42318}.btn.sm{padding:5px 10px;font-size:12px}.btn.ok{background:var(--ok)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}.chk input{width:18px;height:18px}
.list .it{display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #eef2fa;cursor:pointer}
.list .it:hover{background:#f6f9ff}.it.sel{background:#eaf1ff;border-radius:10px}
.it .nm{flex:1;min-width:0}.it .sm{color:var(--mut);font-size:11.5px}
.sp{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.sp.error{background:#fee4e2;color:#b42318}.sp.warn{background:#fef0c7;color:#b54708}.sp.info{background:#dbeafe;color:#1d4ed8}.sp.ok{background:#d1fadf;color:#05603a}.sp.grey{background:#eef2f7;color:#475467}
.rv{border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:9px 10px;margin-bottom:8px;background:#fff}
.rv.error{border-left-color:var(--err)}.rv.warn{border-left-color:var(--warn)}.rv.info{border-left-color:var(--info)}
.rv .tt{font-weight:650;margin:3px 0 2px}.rv .dt{font-size:12.5px;color:#344054}.rv .fx{font-size:12.5px;color:#05603a;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:14px;padding:10px;color:#fff}.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi.e{background:linear-gradient(135deg,#f04438,#b42318)}.kpi.w{background:linear-gradient(135deg,#f79009,#b54708)}.kpi.i{background:linear-gradient(135deg,#2e90fa,#1849a9)}
table.t{border-collapse:collapse;width:100%;font-size:12px}table.t th,table.t td{padding:6px 5px;border-bottom:1px solid #edf1f8;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-weight:600}table.t tr.sel td{background:#f1ebff}table.t tr[data-act]{cursor:pointer}
.secc{border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:8px;background:#fbfcff}
.secc .hd{font-weight:700;color:var(--b1);margin-bottom:6px;font-size:13px}
.photoBox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);user-select:none;background:#eef2f8}
.photoBox img{display:block;width:100%;pointer-events:none}
.photoBox.tap{cursor:crosshair;outline:3px solid #f79009}
.fbox{position:absolute;border:2px solid #f04438;background:rgba(240,68,56,.12);pointer-events:none}
.fbox span{position:absolute;left:0;top:-1px;background:#f04438;color:#fff;font-size:10px;padding:0 4px;border-radius:0 0 6px 0;white-space:nowrap}
.tapdot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#f79009;border:2px solid #fff;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:50;align-items:center;justify-content:center;padding:10px}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:min(980px,97vw);max-height:95vh;overflow:auto;padding:14px;width:100%}
.mbox h2{margin:0 0 10px;font-size:17px;color:var(--b1)}
#cornerCv{display:block;width:100%;touch-action:none;border-radius:10px;background:#111}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.empty{color:var(--mut);font-size:13px;padding:6px 2px}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid #0002;vertical-align:middle}
@media(max-width:900px){.vtools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.vtools .pill{padding:4px 9px;font-size:11.5px}header .hbtn,header .hsel{padding:5px 10px;font-size:12px}.app{display:block;height:auto}.vp{height:52vh;position:sticky;top:0;z-index:4}.panel{border-left:0;overflow:visible}.tabs{position:static}.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Manoj Interior Studio</h1><div class="sub" id="hSub"></div></div>
  <select class="hsel" id="designSel" title="Design option"></select>
  <button class="hbtn" data-act="designs">Designs</button>
  <select class="hsel" id="unitSel" title="Display unit">
    <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">inch</option><option value="ft">ft-in</option>
  </select>
  <button class="hbtn" data-act="projects">Projects</button>
</header>
<div class="app">
  <div class="vp">
    <div id="view"></div><div id="labels"></div>
    <div class="vtools">
      <button class="pill on" data-act="nav" id="bNav" title="One-finger drag: rotate or move the view">⟳ Rotate</button>
      <button class="pill" data-act="view" data-v="3d" title="Reset view">⌂ 3D</button>
      <button class="pill" data-act="view" data-v="top">Top</button>
      <button class="pill" data-act="view" data-v="W1">W1</button>
      <button class="pill" data-act="view" data-v="W2">W2</button>
      <button class="pill" data-act="view" data-v="W3">W3</button>
      <button class="pill" data-act="view" data-v="W4">W4</button>
      <button class="pill" data-act="tog" data-t="shutters" id="tgShutters">Shutters</button>
      <button class="pill" data-act="tog" data-t="zones" id="tgZones">Keep-clear zones</button>
      <button class="pill" data-act="tog" data-t="labels" id="tgLabels">Labels</button>
      <button class="pill" data-act="tog" data-t="svc" id="tgSvc">Service points</button>
      <button class="pill" data-act="undo" id="bUndo">↶ Undo</button>
      <button class="pill" data-act="redo" id="bRedo">↷ Redo</button>
      <button class="pill" data-act="hd">📷 HD image</button>
    </div>
    <div class="vbadge" id="vBadge"></div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="tabBody"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   Manoj Interior Studio — Step 1
   All internal lengths are millimetres. Display unit is a conversion layer only.
   ========================================================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const APP_VERSION='Step 3 · build 1';

/* ---------------- Units ---------------- */
const UF={mm:1,cm:10,m:1000,in:25.4,ft:304.8};
let unit='mm';
const uLabel=()=>unit==='ft'?'ft-in':unit==='in'?'inch':unit;
function parseLen(str){
  if(str==null)return NaN;
  let s=String(str).trim().toLowerCase().replace(/,/g,'');
  if(!s)return NaN;
  s=s.replace(/feet|foot/g,'ft').replace(/inches|inch/g,'in').replace(/[′’`]/g,"'").replace(/[″”]/g,'"').replace(/''/g,'"')
     .replace(/millimetres?|millimeters?/g,'mm').replace(/centimetres?|centimeters?/g,'cm').replace(/metres?|meters?/g,'m');
  const re=/(\d*\.?\d+)\s*(mm|cm|m|ft|in|'|")?/g;
  const tokens=[];let m;
  while((m=re.exec(s)))tokens.push({v:parseFloat(m[1]),u:m[2]||''});
  if(!tokens.length)return NaN;
  if(s.replace(re,'').replace(/[\s+-]/g,''))return NaN; // unknown text
  let total=0;
  tokens.forEach((t,i)=>{
    let u=t.u;
    if(!u){
      if(i>0&&(tokens[i-1].u==="'"||tokens[i-1].u==='ft'))u='in';      // 8' 6  -> 6 inches
      else u=unit;
    }
    total+=t.v*({mm:1,cm:10,m:1000,ft:304.8,"'":304.8,in:25.4,'"':25.4}[u]);
  });
  return total;
}
function fmt(mm){
  if(mm==null||!isFinite(mm))return '–';
  if(unit==='ft'){
    const neg=mm<0;let inch=Math.abs(mm)/25.4,ft=Math.floor(inch/12),r=Math.round((inch-ft*12)*4)/4;
    if(r>=12){ft++;r-=12}
    const rs=Number.isInteger(r)?String(r):String(r);
    return (neg?'-':'')+(ft?ft+"' ":'')+rs+'"';
  }
  const dp={mm:0,cm:1,m:3,in:2}[unit];
  return (+(mm/UF[unit]).toFixed(dp)).toLocaleString('en-IN',{maximumFractionDigits:dp})+' '+uLabel();
}
function fmtIn(mm){
  if(mm==null||!isFinite(mm))return '';
  if(unit==='ft')return fmt(mm);
  return String(+(mm/UF[unit]).toFixed({mm:1,cm:2,m:4,in:3}[unit]));
}

/* ---------------- Constants ---------------- */
const WALLS=['W1','W2','W3','W4'];
const WALLNAME={W1:'Back',W2:'Right',W3:'Front',W4:'Left'};
const FT={
  window:{label:'Window',w:1200,h:1200,b:900,zone:600,color:'#7cc4e0',two:true},
  door:{label:'Door',w:900,h:2100,b:0,zone:900,color:'#8b684b',two:true},
  switch:{label:'Switch box',w:180,h:120,b:1200,zone:150,color:'#f8fafc'},
  socket:{label:'Socket',w:120,h:120,b:300,zone:150,color:'#fde68a'},
  light:{label:'Wall light',w:200,h:200,b:2100,zone:600,color:'#fff3b0'},
  ac:{label:'AC unit',w:1000,h:320,b:2300,zone:1000,color:'#e5edf5',two:true},
  water:{label:'Water point',w:100,h:100,b:900,zone:150,color:'#60a5fa'}
};
const FINISHES=[['#ece6da','Frosty white'],['#f6f1e7','Ivory'],['#d8c3a5','Sand'],['#b78b5a','Oak'],['#8b6b4e','Teak'],['#5e4535','Walnut'],['#565b62','Charcoal'],['#2f3b4c','Navy'],['#8faaa0','Sage'],['#a9c2d1','Blue-grey'],['#9b2d30','Maroon']];
const WALLCOLORS=[['#efe9df','Warm off-white'],['#f7f5ef','White'],['#f4ecd8','Ivory'],['#dce5e8','Soft grey-blue'],['#d6d0c5','Greige'],['#e8d9c4','Beige'],['#cfe0d4','Mint']];
const LAYOUTS=[['shelves','Shelves'],['long','Long hanging (rod + top shelf)'],['short','Short hanging + shelves below'],['drawers','Drawers + shelves above'],['drawersHang','Drawers + hanging above'],['open','Open shelves (no shutter)'],['empty','Empty section']];

/* ---------------- State ---------------- */
let P=null;                     // current project
let selId=null,selPart=null,selFeat=null,curWall='W1',tab='site';
let view={shutters:true,zones:false,labels:true,svc:true};
let review=[];
let tapMode=false,tapType='switch',tapFirst=null;

function design(){return P.designs.find(d=>d.id===P.curDesign)||P.designs[0]}
function getF(id){return design().furniture.find(f=>f.id===id)}
function curF(){return selId?getF(selId):null}
function wallLen(w){return (w==='W1'||w==='W3')?P.site.L:P.site.W}

function sec(layout,shelves,drawers,leaves,mirror){return {layout,shelves,drawers,drawerH:180,leaves,mirror,width:0,shelfHeights:''}}
function newWardrobe(){return {id:uid(),type:'wardrobe',name:'Wardrobe',w:1800,h:2400,d:600,

  P.site.features.filter(d=>d.type==='door').forEach(d=>{const di=doorInfo(d);if(!di.swingIn||di.leaves!==1)return;const u=featU(d),[a,b]=d.hinge==='right'?[u+d.w,u+2*d.w]:[u-d.w,u],lock=d.hinge==='right'?u-250:u+d.w+150;

  const ceilIts=sv.items.filter(i=>SVT[i.t]&&SVT[i.t][2]!=='wall');

function areaF(label,s,k,v){return fld(label,s,k,`<textarea class="in" rows="3" data-s="${s}" data-k="${k}" data-t="txt">${esc(v)}</textarea>`)}
function selF(label,s,k,v,opts,hint){return fld(label,s,k,`<select class="in" data-s="${s}" data-k="${k}" data-t="sel">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`,hint)}
function chkF(label,s,k,v){return `<label class="chk"><input type="checkbox" data-s="${s}" data-k="${k}" data-t="chk" ${v?'checked':''}> ${label}</label>`}
function colorF(label,s,k,v,list){const L=list||FINISHES;const has=L.some(x=>x[0]===v);const opts=L.slice();if(!has)opts.push([v,'Custom colour']);
  return fld(`${label} <span class="swatch" style="background:${esc(v)}"></span>`,s,k,`<div class="row" style="flex-wrap:nowrap"><select class="in" data-s="${s}" data-k="${k}" data-t="sel">${opts.map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${b}</option>`).join('')}</select><input type="color" data-s="${s}" data-k="${k}" data-t="sel" value="${esc(v)}" style="width:42px;height:34px;border:0;background:none;padding:0"></div>`)}
const wallOpts=()=>WALLS.map(w=>[w,`${w} — ${WALLNAME[w]} wall`]);

/* ---------------- Render: header, tabs ---------------- */
function renderHeader(){
  $('hSub').textContent=`${P.name}${P.client?' · '+P.client:''} · ${APP_VERSION}`;
  $('designSel').innerHTML=P.designs.map(d=>`<option value="${d.id}" ${d.id===P.curDesign?'selected':''}>${esc(d.name)} · ${esc(d.status)}</option>`).join('');
  $('tgShutters').classList.toggle('on',view.shutters);$('tgZones').classList.toggle('on',view.zones);$('tgLabels').classList.toggle('on',view.labels);$('tgSvc').classList.toggle('on',view.svc);
  $('bUndo').disabled=hi<=0;$('bRedo').disabled=hi>=hist.length-1;
  const c={error:0,warn:0,info:0};review.forEach(r=>c[r.sev]++);
  $('vBadge').innerHTML=`<span class="sp ${c.error?'error':'ok'}" data-act="tab" data-v="review" style="cursor:pointer">${c.error} errors</span><span class="sp warn" data-act="tab" data-v="review" style="cursor:pointer">${c.warn} warnings</span>`;
  const T=[['site','Site & walls'],['furn','Furniture'],['svc','Services'],['review',`Review${c.error?' ('+c.error+'!)':''}`],['parts','Parts']];
  $('tabs').innerHTML=T.map(([k,l])=>`<button class="pill ${tab===k?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('');
}
function renderPanel(){
  const act=document.activeElement,key=act&&act.dataset&&act.dataset.s?act.dataset.s+'|'+act.dataset.k:null;
  const st=document.querySelector('.panel').scrollTop;
  $('tabBody').innerHTML=tab==='site'?tabSite():tab==='furn'?tabFurn():tab==='svc'?tabSvc():tab==='review'?tabReview():tabParts();
  document.querySelector('.panel').scrollTop=st;
  if(key){const el=[...document.querySelectorAll('[data-s]')].find(x=>x.dataset.s+'|'+x.dataset.k===key);if(el&&el.type!=='checkbox')try{el.focus({preventScroll:true})}catch(e){}}
  if(tab==='site')bindPhotoBox();
}
function refresh(rebuild){review=runReview();buildScene();renderHeader();renderPanel()}

  if(ph&&ph.src){

      <div class="hint">${tapMode?(FT[tapType].two?`Tap two opposite corners of the ${FT[tapType].label.toLowerCase()} on the photo.`:`Tap the centre of the ${FT[tapType].label.toLowerCase()} on the photo.`)+' Then confirm the exact measurements below — your tape measurements always win over the photo.':'The photo is straightened onto the wall. Markers placed on it are approximate; enter the measured values.'}</div>
      <div class="row" style="margin-top:8px"><button class="btn sec sm" data-act="photoRemark">Re-mark corners</button><button class="btn sec sm" data-act="photoUp">Replace photo</button><button class="btn dan sm" data-act="photoDel">Remove photo</button></div>`;
  }else h+=`<button class="btn sec" data-act="photoUp">📷 Add photo of wall ${curWall}</button><div class="hint">Take the photo facing the wall. You'll mark its 4 corners and the app will straighten it onto the 3D wall.</div>`;

function featEditor(f){const S='feat:'+f.id;
  let h=`<div class="secc"><div class="g2">${selF('Type',S,'type',f.type,Object.entries(FT).map(([k,v])=>[k,v.label]))}${selF('Wall',S,'wall',f.wall,wallOpts())}
    ${selF('Measured from',S,'ref',f.ref,[['left','Left corner'],['right','Right corner']])}${lenF('Distance from that corner',S,'dist',f.dist,'to the nearest edge')}
    ${lenF('Width',S,'w',f.w)}${lenF('Height',S,'h',f.h)}`;
  if(f.type!=='door')h+=lenF(f.type==='window'?'Sill height from floor':'Bottom from floor',S,'b',f.b);
  if(f.type==='door'){const di=doorInfo(f);
    h+=`</div><div class="secc" style="margin-top:8px"><div class="hd">Door design</div><div class="g2">${selF('Style',S,'style',di.st,DOORSTYLES)}${colorF('Finish',S,'color',f.color||'#6b4226',DOORCOLORS)}`;
    if(!di.slide&&!di.bif&&!['carved','pooja','french'].includes(di.st))h+=selF('Leaves',S,'leaves',f.leaves||1,[[1,'Single leaf'],[2,'Double (2 parts)']]);
    if(!di.slide&&!di.bif)h+=selF('Opens',S,'swing',f.swing==='out'?'out':'in',[['in','Into this room'],['out','Away from this room']]);
    if(!di.slide&&!di.bif&&di.leaves===1)h+=selF('Hinge side',S,'hinge',f.hinge||'left',[['left','Left'],['right','Right']]);
    if(di.st==='barn')h+=selF('Slides to',S,'slideSide',f.slideSide||'left',[['left','Left (over the wall)'],['right','Right (over the wall)']]);
    h+=`</div><div class="hint">${{flush:'Common Indian bedroom/bathroom door: flush board with laminate or veneer.',panel:'Solid teak frame with raised panels — traditional Indian.',carved:'Double-leaf main entrance with CNC / hand carving.',main_safety:'Main door plus a steel safety grille door on the outside (very common in Indian apartments).',pooja:'Double door with jaali upper panels and bells; lets the diya light and incense through.',shaker:'Flat recessed-panel frame door, common in Western interiors.',french:'Glazed double door with glazing bars, for living → balcony or study.',barn:'Hangs on a top rail and slides over the wall — the wall beside it must stay clear.',pocket:'Slides into a cavity inside the wall — needs a stud/cavity wall of 125 mm+.',bifold:'Folding panels, saves swing space — good for wardrobes, utility, small rooms.',slidingGlass:'Two aluminium-frame glass panels on a track, for balconies.'}[di.st]}</div>`;
  }
  else h+=lenF('Keep clear in front',S,'zone',f.zone,'Furniture inside this depth is flagged');
  h+=`</div><div class="row" style="margin-top:8px"><button class="btn dan sm" data-act="featDel" data-v="${f.id}">Delete</button><button class="btn sec sm" data-act="featDone">Done</button></div></div>`;return h}

function tabParts(){
  const f=curF();let h='';
  if(f){const G=gen(f);
    h+=`<div class="card"><h3>Parts — ${esc(f.name)}</h3><div class="hint">Tap a part (here or in 3D) to edit it. Edits stay until you reset them, even when you change the unit's layout.</div><table class="t"><thead><tr><th>Part</th><th>W × H × D</th><th></th></tr></thead><tbody>`;
    const CO=['Carcass','Loft','Panel','Table','Bed','Countertop','Internal','Drawer','Shutter','Mirror','Hardware','Appliance','Loose'];let cat='';G.parts.slice().sort((a,b)=>CO.indexOf(a.cat)-CO.indexOf(b.cat)).forEach(p=>{if(p.cat!==cat){cat=p.cat;h+=`<tr><td colspan="3" style="color:var(--b1);font-weight:700;padding-top:10px">${cat}</td></tr>`}
      h+=`<tr data-act="partSel" data-v="${p.id}" class="${p.id===selPart?'sel':''}"><td>${esc(p.name)}</td><td>${fmt(p.w)} × ${fmt(p.h)} × ${fmt(p.d)}</td><td>${p.edited?'<span class="sp warn">edited</span>':''}${p.hidden?'<span class="sp grey">hidden</span>':''}</td></tr>`});
    h+=`</tbody></table></div>`;
    const sp=G.parts.find(p=>p.id===selPart);
    if(sp){h+=`<div class="card"><h3>Edit: ${esc(sp.name)}</h3><div class="g3">${lenF('From left side','part','x',sp.x)}${lenF('From bottom','part','y',sp.y)}${lenF('From back','part','z',sp.z)}${lenF('Width','part','w',sp.w)}${lenF('Height','part','h',sp.h)}${lenF('Depth','part','d',sp.d)}</div>
      <div class="row" style="margin-top:8px"><button class="btn sec sm" data-act="partReset">Reset this part</button><button class="btn sec sm" data-act="partHide">${sp.hidden?'Show part':'Hide / remove part'}</button></div></div>`;
      const pi=review.filter(r=>r.partId===sp.id&&r.furnId===f.id);pi.forEach(r=>{h+=`<div class="card rv ${r.sev}"><span class="sp ${r.sev}">${r.sev}</span><div class="tt">${esc(r.title)}</div><div class="fx">➜ ${esc(r.fix)}</div></div>`})}
    const hw=Object.entries(G.hw);
    h+=`<div class="card"><h3>Hardware — ${esc(f.name)}</h3>${hw.length?`<table class="t"><tbody>${hw.map(([n,q])=>`<tr><td>${esc(n)}</td><td style="text-align:right"><b>${q}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">None</div>'}</div>`;
    if(G.meta.cuts&&G.meta.cuts.length)h+=`<div class="card"><h3>Countertop cutouts</h3>${G.meta.cuts.map(c=>`<div class="it">${esc(c)}</div>`).join('')}</div>`;
    const cuts=(f.cutouts||[]).map(id=>P.site.features.find(x=>x.id===id)).filter(Boolean);
    if(cuts.length){const tr=furnTransform(f);
      h+=`<div class="card"><h3>Access cutouts in back panel</h3><table class="t"><thead><tr><th>For</th><th>Size</th><th>Position (seen from front)</th></tr></thead><tbody>${cuts.map(ft=>{const fr=wallFrame(ft.wall),c=localToWorld(fr,featU(ft)+ft.w/2,0);
        const cc=Math.cos(tr.rot),ss=Math.sin(tr.rot),dx=c.x-tr.x,dz=c.z-tr.z,lx=cc*dx-ss*dz,cy=featB(ft)+ft.h/2-(f.place.elev||0);
        return `<tr><td>${esc(featName(ft))}</td><td>${fmt(ft.w+40)} × ${fmt(ft.h+40)}</td><td>centre ${fmt(lx)} from left, ${fmt(cy)} from bottom</td></tr>`}).join('')}</tbody></table></div>`}
  }else h+=`<div class="card"><div class="empty">Select a unit to see and edit its parts.</div></div>`;
  // design cutting list
  const agg=new Map();design().furniture.forEach(f=>gen(f).parts.forEach(p=>{if(p.hidden||['Hardware','Appliance','Loose'].includes(p.cat)||['fabric','pillow','light','steel','tv','appliance','metal'].includes(p.mat))return;
    const d=[p.w,p.h,p.d].map(v=>Math.round(v)).sort((a,b)=>b-a);const mat=matName(f,p),k=mat+'|'+d[0]+'|'+d[1];const o=agg.get(k)||{mat,L:d[0],W:d[1],q:0,names:new Set()};o.q++;o.names.add(p.name.replace(/^Section \d+ /,'').replace(/ \d+( front| side [LR]| back| bottom)?$/,'$1'));agg.set(k,o)}));
  const rows=[...agg.values()].sort((a,b)=>a.mat.localeCompare(b.mat)||b.L-a.L);
  h+=`<div class="card"><h3>Cutting list — ${esc(design().name)} <button class="btn sec sm" data-act="csv">Export CSV</button></h3>${rows.length?`<table class="t"><thead><tr><th>Material</th><th>Length × Width</th><th>Qty</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.mat)}<div class="hint">${esc([...r.names].slice(0,2).join(', '))}</div></td><td>${fmt(r.L)} × ${fmt(r.W)}</td><td><b>${r.q}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No panels yet.</div>'}
    <div class="hint">Sheet nesting, wastage and costing come in step 4.</div></div>`;
  window._cutRows=rows;return h}

/* ---------------- Change handlers ---------------- */
function bboxOf(f){return bbox(footprint(f))}
function setMode(f,v){const pl=f.place,tr=furnTransform(f);
  if(v==='free'){const c=rotXZ(tr.rot,f.w/2,f.d/2);pl.cx=tr.x+c.x;pl.cz=tr.z+c.z;pl.rot=Math.round(((tr.rot*180/Math.PI)%360+360)%360);pl.mode='free'}
  else{const fr=wallFrame(v),c=rotXZ(tr.rot,f.w/2,f.d/2),l=worldToLocal(fr,tr.x+c.x,tr.z+c.z);pl.mode='wall';pl.wall=v;pl.offset=clamp(Math.round(l.x-f.w/2),0,Math.max(0,fr.len-f.w));pl.gap=0}}
const SCOPES={
  proj(k,v){P[k]=v},
  room(k,v){if(k==='wallColor'){P.site.wallColor=v;return}const min={L:1000,W:1000,H:1800}[k];if(v<min){toast(`Minimum is ${fmt(min)}`);v=min}P.site[k]=Math.round(v)},
  feat(k,v,id){const f=P.site.features.find(x=>x.id===id);if(!f)return;if(k==='leaves')v=+v;if(k==='style'&&!f.color)f.color={panel:'#6b4226',carved:'#6b4226',main_safety:'#6b4226',pooja:'#8b6b4e',shaker:'#f2f0ea',french:'#f2f0ea'}[v]||'#c8b59a';if(k==='type'){const d=FT[v];Object.assign(f,{type:v,w:d.w,h:d.h,b:d.b,zone:d.zone});if(v==='door'){f.swing='in';f.hinge='left';f.style='flush';f.leaves=1}}else if(k==='wall'){f.wall=v;curWall=v}else f[k]=v},
  furn(k,v){const f=curF();if(!f)return;const pl=f.place;
    switch(k){case 'name':f.name=v;break;
      case 'w':f.w=Math.max(200,v);break;case 'h':f.h=Math.max(200,v);break;case 'd':f.d=Math.max(150,v);break;
      case 'mode':setMode(f,v);break;
      case 'offset':pl.offset=v;break;case 'gap':pl.gap=v;break;case 'elev':pl.elev=v;break;
      case 'left':pl.cx+=v-bboxOf(f).minX;break;case 'back':pl.cz+=v-bboxOf(f).minZ;break;
      case 'rot':pl.rot=((Math.round(v)%360)+360)%360;break;
      case 'sideGap':f.sideGap=v;break;
      case 'carcass':case 'shutter':case 'counter':case 'fabric':case 'style':f.finish[k]=v;break;
      case 'mattress':f.params.mattress=v;if(MATTRESS[v]){f.params.mw=MATTRESS[v][0];f.params.ml=MATTRESS[v][1]}break;
      case 'loftOn':f.params.loft.on=v;break;case 'loftH':f.params.loft.h=v;break;
      case 'nsec':{const n=clamp(Math.round(v),1,8),s=f.params.sections;while(s.length<n)s.push(sec('shelves',3,0,1,false));s.length=n;break}
      default:f.params[k]=(typeof f.params[k]==='number'&&typeof v==='string'&&v!==''&&isFinite(+v))?+v:v}},
  mod(k,v,arg){const f=curF();if(!f)return;const [row,i]=arg.split(':');const m=f.params[row]&&f.params[row][+i];if(!m)return;if(k==='w')v=Math.max(50,v);m[k]=v},
  sec(k,v,i){const f=curF();if(!f)return;const s=f.params.sections[+i];if(!s)return;if(k==='leaves')v=+v;if(k==='width'&&!(v>0))v=0;s[k]=v},
  part(k,v){const f=curF();if(!f||!selPart)return;(f.overrides[selPart]||(f.overrides[selPart]={}))[k]=v},
  design(k,v){design()[k]=k==='quote'?Math.max(0,v):v},
  svc(k,v,id){const it=S().items.find(i=>i.id===id);if(!it)return;if(k==='mods')v=clamp(Math.round(v),1,18);it[k]=v;if(k!=='note')it.auto=false},
  curt(k,v,id){const win=P.site.features.find(f=>f.id===id);if(!win)return;const c=curtainOf(win);c[k]=k==='fullness'?+v:v},
  fc(k,v){const c=S().ceiling;c[k]=v;if(k==='drop')c.drop=clamp(v,50,1200)},
  paintw(k,v,w){const p=S().paint.walls;p[w]=Object.assign({},paintOf(w),p[w]||{},{[k]:v})},
  paintc(k,v){S().paint.ceiling[k]=v},
  rules(k,v){P.settings[k]=v}
};
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='unitSel'){unit=el.value;P.unit=unit;scheduleSave();refresh(true);return}

function readImage(file){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cornerModal(curWall,c.toDataURL('image/jpeg',.88),null)};img.onerror=()=>toast('Could not open that image.');img.src=r.result};r.readAsDataURL(file)}
function cornerModal(wid,orig,corners){

    const fit=()=>{const w=cv.clientWidth;k=w/img.width;cv.width=Math.round(w*devicePixelRatio);cv.height=Math.round(img.height*k*devicePixelRatio);cv.style.height=img.height*k+'px';draw()};

      ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x*k,p.y*k):ctx.moveTo(p.x*k,p.y*k));ctx.closePath();ctx.fillStyle='rgba(36,88,211,.15)';ctx.fill();ctx.strokeStyle='#4f8bff';ctx.lineWidth=2;ctx.stroke();

      if(drag>=0){const p=pts[drag],R=60,z=3,mx=p.x*k<cv.clientWidth/2?cv.clientWidth-R-10:R+10,my=R+10;

        ctx.beginPath();ctx.arc(mx,my,R,0,7);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(mx-10,my);ctx.lineTo(mx+10,my);ctx.moveTo(mx,my-10);ctx.lineTo(mx,my+10);ctx.strokeStyle='#f04438';ctx.lineWidth=2;ctx.stroke()}};

  };img.src=orig}
function rectify(img,q,len,H){
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const sctx=c.getContext('2d');sctx.drawImage(img,0,0);

  const sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let a,b,cc,d,e,f,g,h;
  if(Math.abs(sx)<1e-9&&Math.abs(sy)<1e-9){a=x1-x0;b=x3-x0;cc=x0;d=y1-y0;e=y3-y0;f=y0;g=0;h=0}
  else{const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den;a=x1-x0+g*x1;b=x3-x0+h*x3;cc=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0}

  for(let j=0;j<oh;j++){const v=(j+.5)/oh;for(let i=0;i<ow;i++){const u=(i+.5)/ow,den=g*u+h*v+1,X=(a*u+b*v+cc)/den-.5,Y=(d*u+e*v+f)/den-.5;
    const xi=Math.floor(X),yi=Math.floor(Y),fx=X-xi,fy=Y-yi,oi=(j*ow+i)*4;
    if(xi<0||yi<0||xi>=sw-1||yi>=sh-1){o[oi]=o[oi+1]=o[oi+2]=200;o[oi+3]=255;continue}
    const i00=(yi*sw+xi)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4;
    for(let ch=0;ch<3;ch++)o[oi+ch]=(sd[i00+ch]*(1-fx)+sd[i10+ch]*fx)*(1-fy)+(sd[i01+ch]*(1-fx)+sd[i11+ch]*fx)*fy;o[oi+3]=255}}
  octx.putImageData(od,0,0);return out.toDataURL('image/jpeg',.88)}
function bindPhotoBox(){const box=$('photoBox');if(!box)return;

  const exists=confirm('Import as a NEW copy? (Cancel = replace a project with the same id if it exists)');if(exists)p.id=uid();DB.put(p).then(()=>{closeModal();loadProject(p);toast('Project imported')})}catch(e){toast('Import failed: '+e.message)}};r.readAsText(file)}
function exportCsv(){const rows=[['Material','Length (mm)','Width (mm)','Qty','Parts'],...(window._cutRows||[]).map(r=>[r.mat,r.L,r.W,r.q,[...r.names].join(' / ')])];
  download(`${safe(P.name)}-${safe(design().name)}-cutting-list.csv`,rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function hdImage(){const el=renderer.domElement,w=el.clientWidth,h=el.clientHeight,s=Math.min(3,4096/Math.max(w,h)),pr=renderer.getPixelRatio();
  renderer.setPixelRatio(1);renderer.setSize(Math.round(w*s),Math.round(h*s),false);renderer.render(scene,camera);const url=el.toDataURL('image/png');
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);renderer.render(scene,camera);download(`${safe(P.name)}-${safe(design().name)}-${Date.now()}.png`,url);toast(`Saved ${Math.round(w*s)}×${Math.round(h*s)} image`)}

/* ---------------- Boot ---------------- */
(async function boot(){
  try{initThree()}catch(e){document.body.innerHTML='<div style="padding:30px;font:16px system-ui">This device could not start 3D graphics (WebGL). '+esc(e.message)+'</div>';return}
  try{await DB.open()}catch(e){toast('Storage unavailable — work will not be saved')}
  let p=null;try{const last=localStorage.getItem('mis_last');if(last&&DB.db)p=await DB.get(last);if(!p&&DB.db){const all=await DB.all();p=all.sort((a,b)=>b.updated-a.updated)[0]}}catch(e){}
  if(!p){p=demoProject();if(DB.db)await DB.put(p)}
  loadProject(p);
  window.MIS={get P(){return P},parseLen,fmt,runReview,gen,setUnit:u=>{unit=u}};
})();
</script>
