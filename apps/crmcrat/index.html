<style>
/*
VOICE: a working tool for two partners running a business: calm, quick, confident.
IDEA: a gilt-edged ledger: dark leather spine (sidebar, lock, intro) holding ivory pages.
PICTURE: the live app; the intro draws the gold "C" mark and writes CRMcrat in gilt and ivory.
COLOUR and TYPE: DEVOCRAT metallic gold + ivory on deep espresso; Marcellus wordmark, Inter UI.
LAYOUT: sidebar from 900px, top bar + bottom tab bar on phones; sheets slide up on mobile.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f6f1e6,#100e0a);--panel:light-dark(#fffdf8,#1a1712);--panel2:light-dark(#f0e8d8,#231f17);
--ink:light-dark(#1c1912,#f2ead8);--mute:light-dark(#6a6152,#a99f8b);--line:light-dark(#e4d9c3,#2f2a20);
--gold:light-dark(#8f6b1a,#d8b45c);--goldbg:light-dark(#f3e6c4,#3a2f17);
--spine:#15120d;--ivory:#f3ead8;--gilt:#d8b45c;
--ok:light-dark(#2d7a4c,#6cc896);--okbg:light-dark(#dff0e5,#16301f);--bad:light-dark(#b0412c,#ef9580);--badbg:light-dark(#f7e0da,#3a1d16);--warn:light-dark(#9a5f08,#f0b45a);--warnbg:light-dark(#f8ead2,#3a2a10);
--r:14px;--sh:0 1px 2px rgb(0 0 0/.05),0 6px 18px rgb(0 0 0/.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wm{font-family:Marcellus,Georgia,serif;letter-spacing:.01em;white-space:nowrap}
.wm b{color:var(--gilt);font-weight:400}.wm span{color:var(--ivory)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--spine);color:var(--ivory);padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;border-right:1px solid #2a241a}
.logo{font-size:30px;line-height:1;padding:4px 10px 6px;text-decoration:none;display:block}
.by{font-size:12px;color:#9d927c;padding:0 10px 18px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#cfc5b0;font-weight:500;min-height:44px}
.nav a:hover{background:#221d15;color:var(--ivory)}
.nav a.on{background:linear-gradient(90deg,#3a2f17,#211b12);color:var(--gilt)}
.nav svg{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;display:grid;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#1e1912;border:1px solid #2e2618}
.me .av{width:36px;height:36px;font-size:14px;background:#3a2f17;color:var(--gilt)}
.me div{flex:1;font-size:13px;color:#a99f8b}.me b{display:block;color:var(--ivory);font-size:14px}
.me button{background:none;border:1px solid #3a2f17;color:var(--gilt);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.me button svg{width:17px;height:17px}
.main{display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(3vw,16px);padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .logo{display:none;padding:0;font-size:24px}.top .logo span{color:var(--ink)}
.search{position:relative;flex:1;max-width:480px}
.search input{padding-left:40px;height:42px;min-height:42px;border-radius:12px}
.search>svg{position:absolute;left:12px;top:11px;width:20px;height:20px;color:var(--mute);pointer-events:none}
.results{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0/.18);overflow:hidden;display:none;z-index:5}
.results.show{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;min-height:44px}
.results button:hover,.results button:focus{background:var(--panel2)}
.results small{color:var(--mute);display:block}
.sync{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;margin-left:auto}
.sync i{width:9px;height:9px;border-radius:50%;background:#9d927c;flex:none}
.sync.ok i{background:var(--ok)}.sync.offline i,.sync.error i{background:var(--warn)}.sync.syncing i{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.view{padding:22px max(3vw,16px) 48px;width:100%;max-width:1240px}
h1{font:600 28px/1.15 Inter,sans-serif;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#e6c878,#c19a3e);color:#1a1408;border-color:#a8832f}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px;flex:none}
.icon-btn{width:40px;height:40px;flex:none;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--mute);padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn.ghost{border-color:transparent;background:none;width:36px;height:36px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.kpi .l{color:var(--mute);font-size:13px;font-weight:500}
.kpi .v{font-size:clamp(23px,2.6vw,30px);font-weight:700;margin-top:4px;letter-spacing:-.02em;white-space:nowrap}
.kpi .s{font-size:13px;color:var(--mute);margin-top:2px}
.kpi.gold{background:linear-gradient(150deg,#2a2214,#15120d);color:var(--ivory);border-color:#3a2f17}
.kpi.gold .l,.kpi.gold .s{color:#bdb197}.kpi.gold .v{color:var(--gilt)}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-top:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card>h2+.row,.sech+.row,.card>.row:first-child{border-top:0}
.row .grow{flex:1}
.row .t{font-weight:600}.row .m{font-size:13px;color:var(--mute)}
.row .v{font-weight:700;white-space:nowrap}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600}
.linkish:hover{color:var(--gold)}
.m a{text-decoration:none;font-weight:500;color:var(--ink)}.m a:hover{color:var(--gold)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--gold);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0;color:var(--panel)}
.chk.on{background:var(--gold)}
.chk svg{width:15px;height:15px}
.done .t{text-decoration:line-through;opacity:.55}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.gold{background:var(--goldbg);color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--goldbg);color:var(--gold)}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b08a33,#e6c878);border-radius:99px}
.bars .r{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.bars .r b{white-space:nowrap;font-weight:600;text-align:right;min-width:72px}
.vc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:230px;padding-top:6px}
.vc .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px}
.vc .c i{width:100%;max-width:48px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#e6c878,#a8832f);min-height:3px}
.vc .c b{white-space:nowrap}.vc .c span{color:var(--mute);white-space:nowrap}
.vc .c.now i{box-shadow:0 0 0 2px var(--gold)}
.empty{padding:26px 10px;text-align:center;color:var(--mute)}
.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.cc{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.cc:hover{border-color:var(--gold)}
.cc .n{font-weight:600}.cc .m{font-size:13px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools input{max-width:420px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:14px}
.chip.on{background:var(--spine);color:var(--gilt);border-color:var(--spine)}
.chips .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:var(--panel2);border-radius:var(--r);padding:12px;min-height:320px;scroll-snap-align:start;border:2px dashed transparent;transition:border-color .15s}
.col.over{border-color:var(--gold)}
.col h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 4px 10px;font-size:14px}
.col h3 span{color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab}
.deal.drag{opacity:.4}
.deal .t{font-weight:600}.deal .m{font-size:13px;color:var(--mute)}
.deal .v{font-weight:700;margin-top:6px}
.deal .ctl{display:flex;gap:6px;margin-top:10px}
.deal .ctl button{flex:1;min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap}
.deal .ctl button:hover{border-color:var(--gold)}
.deal .ctl .nx{background:var(--goldbg);color:var(--gold);border-color:transparent}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr[data-act]{cursor:pointer}tbody tr[data-act]:hover{background:var(--panel2)}
.tabbar{display:none}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgb(10 8 5/.55);padding:16px}
.modal.show{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgb(0 0 0/.35);animation:up .22s ease}
.sheet.wide{width:min(820px,100%)}.sheet.xl{width:min(920px,100%)}
.lab{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.sheet .sh h2{margin:0;font-size:18px}
.sheet .sb{padding:18px 18px 22px}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
input,select,textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:16px;font-weight:400;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--goldbg)}
textarea{min-height:76px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:6px}
.actions .left{margin-right:auto}
.lines .ln,.lnh{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 40px;gap:8px}
.lines .ln{margin-bottom:8px}
.lnh{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
.tot{display:grid;justify-content:end;gap:4px;margin-top:10px}
.tot div{display:flex;gap:28px;justify-content:space-between;min-width:230px}
.tot span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.tot .g{font-size:19px;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.logf{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px}
.sech{display:flex;justify-content:space-between;align-items:center;margin:22px 0 4px}.sech h2{margin:0}
.it{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0}
.dot{width:30px;height:30px;border-radius:50%;background:var(--goldbg);color:var(--gold);display:grid;place-items:center;flex:none}
.dot svg{width:15px;height:15px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.ch{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--spine);color:var(--ivory);padding:12px 18px;border-radius:12px;z-index:90;font-weight:500;box-shadow:0 8px 24px rgb(0 0 0/.3);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.inv{background:#fffdf8;color:#1c1912;border-radius:12px;padding:22px;border:1px solid #e4d9c3}
.inv .ih{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #b8902f;padding-bottom:12px;margin-bottom:14px}
.inv th{color:#6a6152}.inv td,.inv th{border-color:#e4d9c3}
.inv .tot .g{border-color:#e4d9c3}
.inv .small{font-size:13px;color:#6a6152}
.note{font-size:13px;color:var(--mute)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel2);margin-bottom:12px;font-size:14px}
.status i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}.status.ok i{background:var(--ok)}.status.warn i{background:var(--warn)}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:14px;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px;cursor:pointer;color:var(--ink)}
.menu svg{width:22px;height:22px;color:var(--gold)}


/* ---------- gold effects ---------- */
.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120}
.cring{position:fixed;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgb(216 180 92/.85);pointer-events:none;z-index:121;opacity:0;transition:opacity .2s,width .2s,height .2s,left .2s,top .2s,background .2s;box-shadow:0 0 12px rgb(216 180 92/.35)}
.cring.on{opacity:1}.cring.hot{width:46px;height:46px;left:-23px;top:-23px;background:rgb(216 180 92/.12)}
html.gc,html.gc *{cursor:var(--cur),auto}
html.gc a,html.gc button,html.gc [data-act],html.gc label,html.gc select,html.gc summary,html.gc [data-k],html.gc [data-g],html.gc .intro{cursor:var(--curh),pointer}
html.gc input:not([type=file]):not([type=checkbox]):not([type=radio]):not([type=range]),html.gc textarea{cursor:text}
html.gc .deal{cursor:var(--curh),grab}
@media (pointer:coarse){.cring{display:none}}

/* ---------- settings tabs, uploads ---------- */
.keys{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}.keys summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;color:var(--gold)}.keys textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.stabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.upl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.upl .pv{width:150px;height:84px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(light-dark(#eee6d6,#2a251c) 0 25%,transparent 0 50%) 0 0/14px 14px}
.upl label.btn,.quick label.btn{display:inline-flex;font-size:15px;color:var(--ink)}
.upl .pv img{max-width:92%;max-height:88%;object-fit:contain}
.upl .pv.logo{width:90px;height:90px;border-radius:50%}
.sealpv{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sealpv img{width:150px;height:150px;background:#fffaf0;border-radius:50%;padding:6px;border:1px solid var(--line)}
.inks{display:flex;gap:10px;flex-wrap:wrap}
.inks button{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.inks button.on{box-shadow:0 0 0 2px var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.seg button{min-height:42px;padding:0 16px;border:0;background:none;cursor:pointer;font-weight:600}
.seg button.on{background:var(--spine);color:var(--gilt)}
.chkl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:500;min-height:44px}
.chkl input{width:20px;height:20px;min-height:0;accent-color:#b08a33}
.sec{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--gold);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}

/* ---------- bill editor ---------- */
.ed{min-width:640px}
.ed th{font-size:12px;padding:6px 4px;white-space:nowrap}

async function api(action,body={},c=conn()){

function setStat(s,msg=''){stat=s;statMsg=msg;const b=$('#sync');if(!b)return;const n=Object.keys(Q).length;
  const txt={local:'This device',syncing:'Syncing',ok:'Synced',offline:n?`Offline · ${n} waiting`:'Offline',error:'Sync problem'}[s];
  b.className='sync '+s;b.querySelector('span').textContent=txt;b.title=msg||(s==='ok'&&META.last?'Last synced '+ago(META.last):txt)}
async function sync(manual){
  if(!connected()||!ME||syncing)return;
  if(!navigator.onLine){setStat('offline');return}
  syncing=true;setStat('syncing');
  const sent=Object.entries(Q).map(([k,u])=>{const i=k.indexOf('|'),t=k.slice(0,i),id=k.slice(i+1);return{k,u,t,r:DB[t]?.find(x=>x.id===id)}}).filter(x=>x.r);
  const first=!META.since;
  try{
    const j=await api('sync',{since:META.since,changes:sent.map(x=>({t:x.t,r:x.r}))});
    sent.forEach(x=>{if(Q[x.k]===x.u)delete Q[x.k]});
    let changed=false;const fresh={};
    for(const t of TABLES)for(const r of (j.rows&&j.rows[t])||[]){
      const i=DB[t].findIndex(x=>x.id===r.id);
      if(Q[t+'|'+r.id])continue;
      if(i<0){DB[t].push(r);changed=true;if(r.by&&r.by!==ME&&!r.del)fresh[r.by]=(fresh[r.by]||0)+1}
      else if((+r.upd||0)>=(+DB[t][i].upd||0)){const o=DB[t][i];if(o.upd!==r.upd||o.del!==r.del){changed=true;if(r.by&&r.by!==ME)fresh[r.by]=(fresh[r.by]||0)+1}DB[t][i]=r}
    }
    META.since=j.now;META.last=Date.now();if('push' in j)META.pushSrv=!!j.push;if(j.sheetUrl)META.sheetUrl=j.sheetUrl;persist();setStat('ok');
    if(changed){refresh(true);ensureSeal().then(ch=>{if(ch)refresh(true)})}
    if(!first){const w=Object.entries(fresh).filter(([b])=>b!=='Sheet');if(w.length)toast(w.map(([b,n])=>`${n} update${n>1?'s':''} from ${b}`).join(' · '))}
    else if(manual)toast('Synced with Google Sheet');
  }catch(e){setStat(navigator.onLine?'error':'offline',e.message);if(manual)toast(e.message)}
  finally{syncing=false}
  if(Object.keys(Q).length&&stat==='ok')soon();
}

function parseFb(t){t=String(t||'');try{const j=JSON.parse(t);if(j&&typeof j==='object')return j}catch(e){}const o={};for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];return o}
const fbConf=()=>{const p=parseFb(settings().fb);return p.apiKey?p:(CFG.firebase||{})};

const fbMissing=()=>{const f=fbConf(),m=['apiKey','projectId','messagingSenderId','appId'].filter(k=>!f[k]);if(!vapid())m.push('VAPID key');return m};
const pushReady=()=>!fbMissing().length;
let pushState=jget(NK)||{};
async function pushToken(){
  const reg=await navigator.serviceWorker.ready;
  const {initializeApp,getApps}=await import(FB+'firebase-app.js');
  const {getMessaging,getToken,isSupported}=await import(FB+'firebase-messaging.js');
  if(!(await isSupported()))throw new Error('ios');
  const app=getApps().length?getApps()[0]:initializeApp(fbConf());
  return getToken(getMessaging(app),{vapidKey:vapid(),serviceWorkerRegistration:reg});
}
async function enablePush(){
  if(!pushReady())return toast('Paste your Firebase keys in the box below first');
  if(framed)return toast('Open your Netlify link to turn on notifications');
  if(!connected())return toast('Connect the Google Sheet first');
  if(!('Notification' in window)||!('serviceWorker' in navigator))return iosHint();
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return toast('Notifications are blocked. Allow them in the browser or phone settings.');
  try{const token=await pushToken();await api('register',{token,device:devName()});pushState={user:ME,token,on:true};jset(NK,pushState);toast('Notifications are on for '+ME);refresh()}
  catch(e){e.message==='ios'?iosHint():toast('Could not turn on notifications: '+e.message)}
}
async function refreshPush(){
  if(!pushReady()||!connected()||!pushState.on||!('Notification' in window)||Notification.permission!=='granted'||!('serviceWorker' in navigator))return;
  try{const token=await pushToken();if(token!==pushState.token||pushState.user!==ME){await api('register',{token,device:devName()});pushState={user:ME,token,on:true};jset(NK,pushState)}}catch(e){}
}
const devName=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'Browser'};

  if(m.length)return['warn',(!CFG_LOADED&&!settings().fb?'config.js did not load (file missing, or a typing mistake in it). ':'')+'Missing: '+m.join(', ')+'. Paste the keys in the box below.'];

  parts=parts.filter(p=>(p.l-=p.dl)>0);parts.forEach(p=>{p.vx*=.975;p.vy=p.vy*.975+.16;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    fx.save();fx.translate(p.x,p.y);fx.rotate(p.r);fx.globalAlpha=Math.min(1,p.l*1.4);fx.fillStyle=p.c;fx.beginPath();p.pts.forEach(([a,b],j)=>j?fx.lineTo(a,b):fx.moveTo(a,b));fx.closePath();fx.fill();
    if(p.glint){fx.strokeStyle='rgba(255,250,230,.9)';fx.lineWidth=.8;fx.beginPath();fx.moveTo(p.pts[0][0],p.pts[0][1]);fx.lineTo(p.pts[1][0],p.pts[1][1]);fx.stroke()}fx.restore()});
  fx.globalAlpha=1;fxRaf=parts.length||rings.length?requestAnimationFrame(fxTick):0}

V.tasks=()=>{

  const T=live('tasks').filter(mine);
  if(!tf)tf=T.some(G.overdue)?'overdue':'today';
  const L=T.filter(G[tf]).sort((a,b)=>tf==='done'?b.due.localeCompare(a.due):(a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99')));
  const nm={overdue:'Overdue',today:'Today',upcoming:'Upcoming',done:'Done'};
  return `<div class="head"><div><h1>Follow-ups</h1><p>Call-backs, meetings and payment reminders. Ones with a time send a push reminder.</p></div><button class="btn pri" data-act="new-task">${ic('plus')}New follow-up</button></div>

V.reports=()=>{

  const D=live('deals'),won=D.filter(d=>d.stage==='Won'),lost=D.filter(d=>d.stage==='Lost').length,T=live('tasks');
  const mv=months.map(m=>({m,v:sum(won.filter(d=>(d.won||'').startsWith(m)))})),mx=Math.max(1,...mv.map(x=>x.v));
  const lbl=m=>new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short'});
  const rate=won.length+lost?Math.round(won.length/(won.length+lost)*100):0;
  const src=SOURCES.map(s=>({s,n:live('contacts').filter(c=>c.source===s).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n),smx=Math.max(1,...src.map(x=>x.n));
  const coll=live('invoices').filter(i=>i.status==='Paid').reduce((a,i)=>a+invTotal(i).total,0),cur=iso().slice(0,7);
  const team=USERS.map(u=>({u,v:sum(won.filter(d=>(d.owner||d.by)===u)),n:won.filter(d=>(d.owner||d.by)===u).length,done:T.filter(x=>x.done&&x.assignee===u).length,open:T.filter(x=>!x.done&&x.assignee===u).length,cs:live('contacts').filter(c=>c.owner===u).length}));
  const tmx=Math.max(1,...team.map(x=>x.v));

  <div class="grid two"><div class="card"><h2>Won revenue, last 6 months</h2><div class="vc">${mv.map(x=>`<div class="c ${x.m===cur?'now':''}"><b>${x.v?kfmt(x.v):''}</b><i style="height:${x.v/mx*78}%"></i><span>${lbl(x.m)}</span></div>`).join('')}</div></div>
  <div class="card"><h2>${USERS.join(' vs ')}</h2>${team.map(x=>`<div class="row"><span class="av">${ini(x.u)}</span><div class="grow"><div class="t">${esc(x.u)}</div><div class="m">${x.n} won · ${x.cs} contacts · ${x.done} follow-ups done · ${x.open} open</div><div class="bar" style="margin-top:6px"><i style="width:${x.v/tmx*100}%"></i></div></div><div class="v">${inr(x.v)}</div></div>`).join('')}</div></div>

let locked=true,hiddenAt=0;
const G={mode:'unlock',pin:'',first:'',user:null,fails:+(sessionStorage.getItem('crm-f')||0),until:0,msg:'',shake:false,changing:false};
async function hashPin(pin,salt){const s=salt+':'+pin;if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}

function gRender(){const b=$('#gbody');
  if(G.mode==='pick'){b.innerHTML=`<h1>Who is using this phone?</h1><p>Demo: pick a name to go straight in. No PIN needed.</p><div class="who">${USERS.map(u=>`<button data-g="pick" data-u="${esc(u)}"><span class="av">${ini(u)}</span>${esc(u)}</button>`).join('')}</div>`;return}
  if(G.mode==='forgot'){b.innerHTML=connected()?`<h1>Reset your PIN</h1><p>Enter the team key from your Google Sheet setup. Your data stays safe.</p><form id="gform" class="gform"><input name="k" required placeholder="Team key" autocomplete="off" aria-label="Team key"><button class="btn pri">Reset PIN</button></form><button class="glink" data-g="cancel">Back</button>`
    :`<h1>Reset your PIN</h1><p>This phone is not connected to the Google Sheet, so resetting erases the CRM data saved on it.</p><button class="btn pri" data-g="wipe" style="width:100%">Erase and start again</button><button class="glink" data-g="cancel">Back</button>`;return}
  const wait=G.until>Date.now();
  const H={unlock:[`Welcome back, ${esc(ME)}`,wait?`Too many tries. Wait ${Math.ceil((G.until-Date.now())/1000)} s`:'Enter your PIN'],create:[G.changing?'New PIN':`Hi ${esc(G.user)}`,'Create a 4-digit PIN'],confirm:['Confirm PIN','Enter the same PIN again']}[G.mode];
  const aux=G.mode==='unlock'?'Forgot?':G.mode==='create'?(G.changing?'Cancel':'Back'):'Back';
  b.innerHTML=`<h1>${H[0]}</h1><p class="${G.msg||wait?'err':''}" aria-live="polite">${G.msg||H[1]}</p><div class="dots ${G.shake?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<G.pin.length?'on':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="aux" data-g="aux">${aux}</button><button data-k="0">0</button><button data-k="del" aria-label="Delete digit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"/></svg></button></div>`;
  if(wait)setTimeout(gRender,1000);
}
async function gKey(k){
  if(G.until>Date.now())return;
  if(k==='del'){G.pin=G.pin.slice(0,-1);G.msg='';G.shake=false;return gRender()}
  if(G.pin.length>=4)return;
  G.pin+=k;G.msg='';G.shake=false;gRender();
  if(G.pin.length<4)return;
  const pin=G.pin;await new Promise(r=>setTimeout(r,140));
  if(G.mode==='unlock'){
    if(await hashPin(pin,AUTH.salt)===AUTH.hash){G.fails=0;sessionStorage.removeItem('crm-f');unlock();return}
    G.fails++;sessionStorage.setItem('crm-f',G.fails);
    if(G.fails>=5){G.until=Date.now()+30000;G.fails=0;sessionStorage.removeItem('crm-f')}
    Object.assign(G,{pin:'',msg:G.until>Date.now()?'':'Wrong PIN, try again',shake:true});return gRender()}
  if(G.mode==='create'){Object.assign(G,{first:pin,pin:'',mode:'confirm'});return gRender()}
  if(G.mode==='confirm'){
    if(pin!==G.first){Object.assign(G,{pin:'',first:'',mode:'create',msg:'The PINs did not match. Try again',shake:true});return gRender()}
    const salt=uid(),was=G.changing;AUTH={user:G.user,salt,hash:await hashPin(pin,salt)};jset(AK,AUTH);ME=AUTH.user;
    unlock();toast(was?'PIN changed':`Welcome, ${ME}. CRMcrat is ready.`);
  }
}

  else if(a==='aux'){if(G.mode==='unlock')gate('forgot');else if(G.mode==='confirm')gate('create',{user:G.user});else if(G.changing)unlock();else gate('pick')}
  else if(a==='cancel')gate('unlock');
  else if(a==='wipe'){try{localStorage.removeItem(DBK);localStorage.removeItem(AK)}catch(_){}location.reload()}
});

    case 'sig-use':if(sigEdit&&sigEdit.out){setAsset('sig',sigEdit.out);sigEdit=null;refresh();toast('Signature saved. It appears on every bill.')}break;
    case 'sig-x':sigEdit=null;refresh();break;
    case 'preview-bill':ensureSeal().then(()=>{show(()=>sheet('Sample bill (not saved)',`<p class="note" style="margin-top:0">This is how your bills look with the current settings.</p><div class="billwrap">${billHTML(sampleBill())}</div>`,'xl'),'preview')});break;
    case 'view-invoice':openInvoice(id);break;
    case 'mark-paid':{const i=invo(id);i.status='Paid';i.paid=iso();i.total=invTotal(i).total;put('invoices',i);log(i.contactId,'Note',`Payment received for ${i.no}: ${inr(i.total)}`);refresh();toast('Marked as paid');break}
    case 'del-invoice':{const i=invo(id);ask('Delete '+i.no+'?','This invoice will be removed for both of you.','Delete',()=>{drop('invoices',id);close();refresh();toast('Invoice deleted')});break}
    case 'print':try{window.print()}catch(_){}break;
    case 'ctag':ctag=el.dataset.v;render();break;
    case 'tf':tf=el.dataset.v;render();break;
    case 'tw':tw=el.dataset.v;tf=null;render();break;
    case 'tw-all':tw='all';tf='today';location.hash='tasks';render();break;
    case 'more':show(()=>sheet('More',`<div class="menu">${NAV.slice(4).map(([h,n,i])=>`<a href="#${h}">${ic(i)}${n}</a>`).join('')}<button data-act="lock">${ic('lock')}Lock app</button></div>`),'menu');break;
    case 'install':if(dp){dp.prompt();dp.userChoice.finally(()=>{dp=null;refresh()})}break;
    case 'push-on':enablePush();break;
    case 'push-test':api('testPush').then(j=>toast(j.sent?'Test sent. It should arrive in a few seconds.':META.pushSrv===false?'Add FIREBASE_SA in Apps Script › Script Properties first':'No phone registered yet for '+ME+'. Tap Turn on notifications again.')).catch(e=>toast(e.message));break;
    case 'disconnect':ask('Disconnect Google Sheet?','This phone stops syncing. Data already on it stays here.','Disconnect',()=>{CONN={};jset(CK,CONN);META.since=0;persist();close();setStat('local');refresh();toast('Disconnected')});break;
    case 'change-pin':gate('create',{user:ME,changing:true});break;
    case 'switch-user':ask('Sign out of this device?','You will pick a name and create a new PIN. '+(connected()?'Data stays in the Google Sheet.':'Data on this device stays.'),'Sign out',()=>{AUTH=null;ME=null;try{localStorage.removeItem(AK);localStorage.removeItem(NK)}catch(_){}pushState={};close();gate('pick')});break;
    case 'backup-copy':copy(backupJSON(),'Backup copied. Paste it into a note or email to yourself.');break;
    case 'backup-dl':{const u=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='crmcrat-backup-'+iso()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded');break}
    case 'reset':ask('Load sample data?','Everything on this device is replaced with the sample business.','Load sample',()=>{DB=seed();Q={};META.sample=true;persist();close();tf=null;refresh();toast('Sample data loaded')});break;
    case 'erase':ask('Erase everything?','All contacts, deals, follow-ups and invoices on this device are deleted.','Erase all',()=>{const s=get('settings','main');DB={};TABLES.forEach(t=>DB[t]=[]);if(s)DB.settings=[s];Q={};META.sample=false;persist();close();tf=null;refresh();toast('All data erased')});break;
  }
});
document.addEventListener('click',e=>{if(e.target.closest('.menu a'))close()},true);

document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,id=f.dataset.id,F=new FormData(f),g=n=>String(F.get(n)??'').trim();
  if(k==='connect'){
    const c={url:g('url'),key:g('key')};const btn=f.querySelector('.btn.pri');btn.disabled=true;btn.textContent='Connecting…';
    try{const j=await api('ping',{},c);CONN=c;jset(CK,CONN);META.sheetUrl=j.sheetUrl||'';META.pushSrv=!!j.push;
      if(META.sample){TABLES.forEach(t=>DB[t]=[]);Q={};META.sample=false}else{TABLES.forEach(t=>DB[t].forEach(r=>{Q[t+'|'+r.id]=r.upd||Date.now()}))}
      META.since=0;persist();await sync();render();toast('Connected to your Google Sheet')}
    catch(err){btn.disabled=false;btn.textContent='Connect Google Sheet';toast(/fetch/i.test(err.message)?'Could not reach the Apps Script. Check the URL and your internet.':err.message)}
    return}
  if(k==='act'){log(id,g('type'),g('text'));refresh();toast('Interaction saved');return}
  if(k==='setup'){const o={};['biz','tagline','phone','email','addr','state','gst','pan','udyam','prefix','bank','accName','accNo','ifsc','upi','terms','signName'].forEach(n=>{if(F.has(n))o[n]=g(n)});if(F.has('gstRate'))o.gstRate=+g('gstRate')||0;if(F.has('gstDefault'))o.gstDefault=g('gstDefault')==='1';['gst','pan'].forEach(n=>{if(o[n])o[n]=o[n].toUpperCase()});if('biz' in o&&!o.biz)o.biz='DEVOCRAT';if('prefix' in o&&!o.prefix)o.prefix='INV-';put('settings',Object.assign(settings(),o));if(o.upi)lib('qr').catch(()=>{});refresh();toast('Saved');return}
  if(k==='contact'){const o={name:g('name'),phone:g('phone'),email:g('email'),company:g('company'),city:g('city'),source:g('source'),owner:g('owner'),address:g('address'),state:g('state'),gstin:g('gstin').toUpperCase(),pan:g('pan').toUpperCase(),udyam:g('udyam'),tags:g('tags').split(',').map(s=>s.trim()).filter(Boolean)};
    if(id){put('contacts',Object.assign(contact(id),o));goBack();refresh();toast('Contact updated');return}
    o.created=Date.now();const c=put('contacts',o);log(c.id,'Note',`Added as a lead from ${o.source}`);
    if(g('fu'))put('tasks',{contactId:c.id,title:'First follow-up with '+o.name.split(' ')[0],due:g('fu'),time:'',type:'Call',assignee:o.owner,done:false,notified:false,created:Date.now()});
    back=null;openContact(c.id);refresh();toast('Contact added');return}
  if(k==='deal'){const o={title:g('title'),contactId:g('contactId'),value:+g('value')||0,stage:g('stage'),close:g('close'),owner:g('owner')};
    if(id){const d=deal(id);if(o.stage==='Won'&&d.stage!=='Won')o.won=iso();if(o.stage!=='Won')o.won='';const moved=o.stage!==d.stage;put('deals',Object.assign(d,o));if(moved)log(o.contactId,'Note',`Deal "${o.title}" moved to ${o.stage}`);toast('Deal updated')}
    else{o.created=Date.now();o.won=o.stage==='Won'?iso():'';put('deals',o);log(o.contactId,'Note',`New deal: ${o.title} (${inr(o.value)})`);toast('Deal added')}
    goBack();refresh();return}
  if(k==='task'){const o={title:g('title'),contactId:g('contactId'),type:g('type'),due:g('due'),time:g('time'),assignee:g('assignee')};
    if(id){const t=task(id);if(t.due!==o.due||t.time!==o.time)o.notified=false;put('tasks',Object.assign(t,o))}else put('tasks',{...o,done:false,notified:false,created:Date.now()});
    goBack();refresh();toast(id?'Follow-up updated':o.assignee!==ME?`Follow-up sent to ${o.assignee}`:'Follow-up added');return}
  if(k==='bill'){saveBill();return}
  if(k==='fbkeys'){const f=parseFb(g('fb')),v=g('vapid').replace(/\s+/g,'');const miss=['apiKey','projectId','messagingSenderId','appId'].filter(x=>!f[x]);
    if(miss.length)return toast('The config is missing '+miss.join(', ')+'. Copy the whole firebaseConfig block.');
    if(!/^[A-Za-z0-9_-]{60,}$/.test(v))return toast('The VAPID key looks wrong. Copy the long key (starts with B) from Web Push certificates.');
    const keep={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(x=>{if(f[x])keep[x]=f[x]});
    put('settings',Object.assign(settings(),{fb:JSON.stringify(keep),vapid:v}));refresh();toast('Firebase keys saved. Now tap Turn on notifications.');return}
  if(k==='seal'){put('settings',Object.assign(settings(),{seal1:g('seal1')||'DEVOCRAT',seal2:g('seal2')||'THE JOINT FAMILY'}));ensureSeal().then(()=>refresh());toast('Seal updated');return}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cfind'){cq=t.value;const p=t.selectionStart;render();const n=$('#cfind');n.focus();try{n.setSelectionRange(p,p)}catch(_){}return}
  if(t.dataset.b&&t.closest('form[data-form=bill]'))return setB(t);
  if(t.id==='sigk'&&sigEdit){sigEdit.k=+t.value;clearTimeout(sigEdit.t);sigEdit.t=setTimeout(sigRun,60);return}
  if(t.id==='gq'){const q=t.value.trim().toLowerCase(),R=$('#results');if(!q){R.classList.remove('show');return}
    const cs=live('contacts').filter(c=>[c.name,c.company,c.phone,c.city].join(' ').toLowerCase().includes(q)).slice(0,6);
    const ds=live('deals').filter(d=>d.title.toLowerCase().includes(q)).slice(0,4);
    R.innerHTML=cs.map(c=>`<button data-act="open-contact" data-id="${c.id}">${esc(c.name)}<small>${esc([c.company,c.phone].filter(Boolean).join(' · '))}</small></button>`).join('')+ds.map(d=>`<button data-act="open-contact" data-id="${d.contactId}">${esc(d.title)}<small>Deal · ${inr(d.value)} · ${d.stage}</small></button>`).join('')||'<div class="empty" style="padding:14px">No matches</div>';
    R.classList.add('show')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.b&&t.closest('form[data-form=bill]'))return setB(t);
  if(t.dataset.bsel){BF.contactId=t.value;BF.billTo=billToFrom(contact(t.value));BF.place='';BF.saveC=true;autoTax();bRerender();return}
  if(t.id==='fx-burst'||t.id==='fx-cursor'){FXS[t.id==='fx-burst'?'burst':'cursor']=t.checked;jset(FXK,FXS);applyFx();if(!FXS.cursor)cring.classList.remove('on');return}
  if(t.id==='logofile'&&t.files[0]){const f=t.files[0];t.value='';readImg(f).then(im=>{const clean=$('#logoclean')?.checked;const url=clean?cleanImg(im,30,420,false):fitCanvas(im,420).toDataURL('image/png');if(!url)return toast('Could not read that logo');setAsset('logo',url);refresh();toast('Logo saved. It appears on every bill.')}).catch(err=>toast(err.message));return}
  if(t.id==='sigfile'&&t.files[0]){const f=t.files[0];t.value='';readImg(f).then(im=>{sigEdit={im,k:45,out:''};sigRun(true)}).catch(err=>toast(err.message));return}
  if(e.target.id==='restore'){const file=e.target.files[0];e.target.value='';if(!file)return;
    file.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch(_){}
      const db=d&&(d.db||d);if(!db||!Array.isArray(db.contacts))return toast('That file is not a CRMcrat backup');
      ask('Restore this backup?',`It has ${db.contacts.length} contacts and ${(db.deals||[]).length} deals.${connected()?' They will be merged into the Google Sheet.':' It replaces the data on this device.'}`,'Restore',()=>{
        if(connected()){TABLES.forEach(t=>(db[t]||[]).forEach(r=>{r.upd=Date.now();DB[t]=DB[t].filter(x=>x.id!==r.id);DB[t].push(r);Q[t+'|'+r.id]=r.upd}))}
        else{TABLES.forEach(t=>DB[t]=Array.isArray(db[t])?db[t]:[]);META.sample=false}
        persist();soon();close();tf=null;refresh();toast('Backup restored')})})}
});
document.addEventListener('keydown',e=>{if($('#gate').classList.contains('show'))return;
  if(e.key==='Enter'&&e.target.id==='colname'){e.preventDefault();$('[data-act=b-coladd]')?.click();return}
  if(e.key==='Enter'&&e.target.matches('form[data-form=bill] input')){e.preventDefault();return}if(e.key==='Escape'){if($('#modal').classList.contains('show'))goBack();$('#results').classList.remove('show')}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#gq').focus()}});

let dragId=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest?.('.deal');if(!d)return;dragId=d.dataset.id;d.classList.add('drag');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragend',e=>{e.target.closest?.('.deal')?.classList.remove('drag');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.col');if(!c||!dragId)return;e.preventDefault();const id=dragId;dragId=null;moveDeal(id,c.dataset.stage)});

/* ---------- PWA ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!locked)refresh()});
addEventListener('appinstalled',()=>{dp=null;refresh();toast('CRMcrat installed')});
if(false){ /* website demo: no service worker */
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='sync'&&!locked)sync();if(d.type==='go'&&d.hash){location.hash=d.hash.replace(/^.*#/,'#')}});
}

/* ---------- start: intro, then lock ---------- */
AUTH=null;ME=null;gate('pick');
const intro=$('#intro');let introDone=false;
function endIntro(){if(introDone)return;introDone=true;intro.classList.add('out');setTimeout(()=>intro.remove(),600)}
intro.addEventListener('click',endIntro);
setTimeout(endIntro,matchMedia('(prefers-reduced-motion: reduce)').matches?900:3300);
}
</script>
