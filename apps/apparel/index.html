:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121014);--ink:light-dark(#16131a,#f2eff4);--mute:light-dark(#6b6570,#a59fab);--line:light-dark(#e8e4e0,#2c2731);--card:light-dark(#f6f4f1,#1c1920);--acc:#ff4d3d;--accd:light-dark(#d93222,#ff6a5c);--plum:light-dark(#2b1b3d,#1f1430);--ok:light-dark(#1d7a46,#4fc785);--warn:light-dark(#b0570e,#f0a35a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,52px);font-weight:800}h2{font-size:clamp(24px,3vw,32px);font-weight:800}h3{font-size:18px;font-weight:600}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.band{padding:clamp(24px,4vw,56px) max(4vw,16px)}.wrap{max-width:1240px;margin:0 auto}
.btn{min-height:44px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.danger{background:transparent;color:var(--accd);border-color:var(--accd)}
.ico{width:44px;height:44px;border:0;background:none;display:inline-grid;place-items:center;border-radius:50%;position:relative}
.ico:hover{background:var(--card)}.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.badge{position:absolute;top:4px;right:2px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
input,select,textarea{min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);width:100%}
textarea{min-height:90px}label{font-size:14px;font-weight:500;color:var(--mute);display:grid;gap:4px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:8px max(4vw,16px);max-width:1320px;margin:0 auto}
.logo{font-family:Archivo;font-weight:800;font-size:20px;text-decoration:none;white-space:nowrap;letter-spacing:-.01em}.logo b{color:var(--acc)}.logo small{font-weight:600;font-size:13px;color:var(--mute);margin-left:4px}
nav.main{display:flex;gap:4px}nav.main a{padding:10px 12px;text-decoration:none;font-weight:700;border-radius:8px}nav.main a.on,nav.main a:hover{color:var(--accd)}
.srch{flex:1;max-width:420px;margin-left:auto}.srch input{border-radius:999px;background:var(--card);border-color:transparent}
.adm-pill{font-size:12px;font-weight:700;background:var(--plum);color:#fff;border-radius:999px;padding:4px 10px;text-decoration:none;white-space:nowrap}
@media(max-width:820px){.hd{flex-wrap:wrap}.srch{order:9;max-width:none;flex-basis:100%}nav.main{order:8;flex-basis:100%;justify-content:space-around}.icons{margin-left:auto}}
.hero{background:var(--plum);color:#fff}.hero .wrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:clamp(20px,4vw,48px);align-items:center}
.hero p{color:#dcd2e8;max-width:46ch;font-size:17px}.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hero .btn.ghost{color:#fff;border-color:#fff}
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{border-radius:18px;overflow:hidden;text-decoration:none;color:#16131a;display:grid;position:relative;transition:transform .25s}
.panel:hover{transform:translateY(-4px)}.panel svg{display:block;width:100%;height:auto}
.panel span{position:absolute;left:14px;bottom:12px;font:800 22px Archivo;color:#16131a;background:#fff;padding:4px 12px;border-radius:999px}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}}
.strip{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-weight:500;font-size:15px;color:var(--mute);padding:14px 16px;border-bottom:1px solid var(--line)}
.strip b{color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{background:var(--card);border-radius:14px;text-decoration:none;padding:10px 10px 12px;border:0;text-align:left;display:grid;gap:4px}
.tile svg{width:100%;height:auto;border-radius:10px}.tile b{font-size:15px}.tile small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 14px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.card{position:relative;display:grid;gap:4px;align-content:start}
.card .ph{border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:5/6;border:0;padding:0;display:block;width:100%}
.card .ph svg,.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .br{font-size:13px;color:var(--mute);font-weight:500}.card .nm{font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:none;border:0;padding:0;text-align:left}
.pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;white-space:nowrap}.pr b{font-size:16px}.pr s{color:var(--mute);font-size:13px}.pr em{color:var(--ok);font-style:normal;font-size:13px;font-weight:700}
.tag{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#fff;color:#16131a}
.tag.out{background:#16131a;color:#fff}.tag.low{background:var(--acc);color:#fff}.tag.hid{background:#6b6570;color:#fff;top:auto;bottom:calc(100% - 34px)}
.heart{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:0;background:#ffffffd9;display:grid;place-items:center;color:#16131a}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}.heart.on svg{fill:var(--acc);stroke:var(--acc)}
.rate{font-size:13px;color:var(--mute)}.rate b{color:var(--ink)}
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
.filters{display:grid;gap:20px;align-content:start;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
.filters h3{font-size:15px;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.ftog{display:none}
@media(max-width:860px){.shop{grid-template-columns:1fr}.filters{position:static;max-height:none;display:none;background:var(--card);padding:16px;border-radius:14px}.filters.open{display:grid}.ftog{display:inline-flex}}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.toolbar select{width:auto}
.more{display:flex;justify-content:center;margin-top:28px}
.ov{position:fixed;inset:0;background:#0009;z-index:40;display:none}.ov.open{display:block}
.modal{position:fixed;z-index:50;background:var(--bg);display:none;overflow:auto;inset:4vh max(3vw,12px);border-radius:20px;max-width:1080px;margin:0 auto}
.modal.open{display:block}.modal .x{position:sticky;top:8px;float:right;margin:8px;z-index:2;background:var(--card)}
@media(max-width:700px){.modal{inset:0;border-radius:0}}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:clamp(16px,3vw,32px)}
@media(max-width:760px){.pd{grid-template-columns:1fr}}
.gal .big{border-radius:16px;overflow:hidden;background:var(--card);aspect-ratio:5/6}.gal .big svg,.gal .big img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.thumbs button{width:64px;height:76px;border-radius:8px;overflow:hidden;padding:0;border:2px solid transparent;background:var(--card)}
.thumbs button.on{border-color:var(--acc)}.thumbs img,.thumbs svg{width:100%;height:100%;object-fit:cover}
.sizes{display:flex;flex-wrap:wrap;gap:8px}.sz{min-width:56px;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;display:grid;place-items:center;line-height:1.1;padding:4px 8px}
.sz small{font-size:11px;font-weight:500;color:var(--warn)}.sz.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}.sz.on small{color:inherit}
.sz:disabled{text-decoration:line-through;opacity:.4}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}.qty button{width:40px;height:40px;border:0;background:none;font-size:20px}.qty span{min-width:28px;text-align:center;font-weight:700}
.info{display:grid;gap:14px;align-content:start}.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:15px}.info dt{color:var(--mute)}.info dd{margin:0}
.perks{display:grid;gap:4px;font-size:14px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mute);font-weight:500}td.n,th.n{text-align:right;white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg);z-index:50;transform:translateX(105%);transition:transform .3s;display:grid;grid-template-rows:auto 1fr auto}
.drawer.open{transform:none}.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dl{overflow:auto;padding:8px 16px}.df{padding:16px;border-top:1px solid var(--line);display:grid;gap:6px}
.ci{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .t{border-radius:8px;overflow:hidden;background:var(--card);aspect-ratio:5/6}.ci .t svg,.ci .t img{width:100%;height:100%;object-fit:cover}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row.tot{font-weight:700;font-size:18px}

.box{background:var(--card);border-radius:16px;padding:18px}

.empty{text-align:center;color:var(--mute);padding:40px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px}.stat b{display:block;font:800 clamp(24px,3vw,32px) Archivo}.stat span{color:var(--mute);font-size:14px}

.scroll{overflow-x:auto}
.ef{display:grid;gap:14px;padding:clamp(16px,3vw,28px)}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:600px){.three{grid-template-columns:1fr 1fr}}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.stk div{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:end}

.phs{display:flex;flex-wrap:wrap;gap:10px}.phs figure{margin:0;width:110px;display:grid;gap:4px}.phs img{width:110px;height:132px;object-fit:cover;border-radius:10px;background:var(--card)}

.dlg>div{background:var(--bg);border-radius:16px;padding:22px;max-width:420px;display:grid;gap:14px}
.note{font-size:13px;color:var(--mute)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

// Talks to the Google Apps Script web app. POST uses text/plain so the browser sends it without a CORS preflight.
async function api(action,data,post){
  if(!API)throw new Error('The Google Sheet is not connected yet (see config.js).');
  let r;
  if(post)r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:tok,...data})});
  else r=await fetch(API+(API.includes('?')?'&':'?')+new URLSearchParams({action,...data}));
  const j=await r.json().catch(()=>({ok:false,error:'The store server sent an unreadable reply.'}));
  if(!j.ok){const e=new Error(j.error||'Something went wrong');e.auth=j.auth;throw e}return j;
}

/* ---------- data ---------- */
function merge(){
  const m={};BASE.forEach(p=>m[p.id]=p);
  for(const [id,o] of Object.entries(OV)){if(o.deleted)delete m[id];else m[id]={...(m[id]||{}),...o,id}}

/* ---------- cards ---------- */

  <div class="pr"><b>${inr(p.p)}</b>${o?`<s>${inr(p.m)}</s><em>${o}% off</em>`:''}</div>

}

/* ---------- views ---------- */
function home(){

  <div class="panels">${pn.map(([l,h,p,bg])=>`<a class="panel" href="#${h}" style="background:${bg}">${p?art({...p,hex:p.hex},l):''}<span>${l}</span></a>`).join('')}</div></div></section>

  <section class="band" style="padding-top:0"><div class="wrap"><div class="sec-h"><h2>New arrivals</h2><a href="#new" class="lnk">View all</a></div><div class="grid">${nw.map(card).join('')}</div></div></section>`;

const PR=[['','Any price'],['0-499','Under ₹500'],['500-999','₹500 – ₹999'],['1000-1999','₹1,000 – ₹1,999'],['2000-99999','₹2,000 and above']];
function filtered(){
  let r=visible();
  if(F.mode==='new')r=r.filter(p=>p.nw);if(F.mode==='sale')r=r.filter(p=>off(p)>=20);
  if(F.mode==='wish')r=r.filter(p=>wish.has(p.id));
  if(F.g)r=r.filter(p=>p.g===F.g);if(F.c)r=r.filter(p=>p.c===F.c);
  if(F.size)r=r.filter(p=>(p.s||{})[F.size]>0);if(F.col)r=r.filter(p=>p.col===F.col);
  if(F.price){const[a,b]=F.price.split('-').map(Number);r=r.filter(p=>p.p>=a&&p.p<=b)}
  if(F.stock)r=r.filter(p=>stockOf(p)>0);
  if(F.q){const w=F.q.toLowerCase().split(/\s+/).filter(Boolean);r=r.filter(p=>{const s=`${p.n} ${p.c} ${p.g} ${p.b} ${p.col} ${p.f} ${p.id}`.toLowerCase();return w.every(x=>s.includes(x.replace(/s$/,'')))})}
  const S={pop:(a,b)=>b.rc-a.rc,new:(a,b)=>(b.nw?1:0)-(a.nw?1:0)||b.id.localeCompare(a.id),lo:(a,b)=>a.p-b.p,hi:(a,b)=>b.p-a.p,off:(a,b)=>off(b)-off(a),rate:(a,b)=>b.r-a.r};
  return r.sort(S[F.sort]||S.pop);
}
function shop(title){

   <div><h3>Price</h3><div class="chips">${PR.map(([v,l])=>`<button class="chip ${F.price===v?'on':''}" data-f="price" data-v="${v}">${l}</button>`).join('')}</div></div>
   <label style="flex-direction:row;display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="fst" style="width:20px;min-height:20px" ${F.stock?'checked':''}> In stock only</label>
  </aside><div>
   <div class="toolbar"><button class="btn ghost sm ftog" id="ftog">Filters</button><label style="display:flex;align-items:center;gap:8px">Sort <select id="sort">${[['pop','Popularity'],['new','Newest'],['lo','Price: low to high'],['hi','Price: high to low'],['off','Discount'],['rate','Rating']].map(([v,l])=>`<option value="${v}" ${F.sort===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
   ${shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:`<div class="empty">${F.mode==='wish'?'Your wishlist is empty. Tap the heart on any product to save it.':'No products match these filters.'}</div>`}
   ${r.length>F.shown?`<div class="more"><button class="btn ghost" id="more">Show more (${(r.length-F.shown).toLocaleString('en-IN')} left)</button></div>`:''}
  </div></div></div></section>`;
}

function openP(id){cur=BY[id];if(!cur)return;curSize='';curQty=1;curImg=0;renderP();$('#pm').classList.add('open');$('#ov').classList.add('open');$('#pm').scrollTop=0}

}

/* ---------- cart ---------- */
function cartLines(){return cart.map(c=>({...c,p:BY[c.id]})).filter(c=>c.p)}
function totals(){const l=cartLines(),sub=l.reduce((a,c)=>a+c.p.p*c.qty,0),mrp=l.reduce((a,c)=>a+Math.max(c.p.m,c.p.p)*c.qty,0),ship=sub===0||sub>=999?0:79;return{l,sub,mrp,ship,tot:sub+ship}}
function renderCart(){

// Shrinks a photo to at most 1400px and JPEG before upload, so it travels fast and fits in Drive nicely.
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1])};img.onerror=()=>rej(new Error('Could not read '+file.name));img.src=u})}

}
function renderEditPhotosOnly(){}
async function delProduct(id){
  const p=BY[id];if(!p||!await ask('Delete this product?',`${p.n} (${p.id}) will be removed from the store and its row deleted from the Google Sheet.`,'Delete'))return;
  try{await api('deleteProduct',{id},true);BASE=BASE.filter(x=>x.id!==id);merge();cacheCat();closeAll();toast('Product deleted');route()}catch(e){if(!authFail(e))toast('Could not delete: '+e.message)}
}
async function loadAllOrders(){if(!isAdmin)return;const r=await api('orders',{},true);allOrders=r.orders}
async function setOrderStatus(i,st){
  const o=allOrders[i];if(!o)return;
  try{const r=await api('setStatus',{oid:o.oid,status:st},true);o.status=st;o.deducted=r.deducted;
    toast(r.changedStock?(st==='Cancelled'?'Order cancelled and stock returned':'Order updated and stock deducted'):'Status updated');
    if(r.changedStock)await loadCatalogue();admin()}catch(e){if(!authFail(e))toast('Could not update: '+e.message);admin()}
}
function logout(){tok='';ls.set('devo-tok','');isAdmin=false;allOrders=[];$('#admLink').hidden=true;if(location.hash==='#admin')admin()}

/* ---------- routing ---------- */
const TITLES={men:['Men','Men’s clothing'],women:['Women','Women’s clothing'],kids:['Kids','Kids’ clothing'],shop:['','All products'],new:['','New arrivals'],sale:['','Sale']};
function route(keep){
  const h=location.hash.slice(1);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));
  if(!BASE.length)return;
  if(TITLES[h]||h==='wishlist'){const[g,t]=TITLES[h]||['','Wishlist'];if(!keep){F.g=g;F.mode=h==='new'?'new':h==='sale'?'sale':h==='wishlist'?'wish':'';if(!F._fromCat){F.c='';F.size='';F.col='';F.price='';}F._fromCat=false;F.shown=24;if(h!=='shop')F.q=''}shop(F.q&&h==='shop'?'Search results':t)}
  else if(h==='checkout')checkout();else if(h==='orders'){orders();loadMyOrders().then(()=>{if(location.hash==='#orders')orders()}).catch(()=>{})}else if(h==='admin')admin();
  else if(/^p-[A-Z0-9]+$/i.test(h)&&BY[h.slice(2)]){home();openP(h.slice(2))}else home();
  if(!keep)window.scrollTo(0,0);
}
addEventListener('hashchange',()=>{closeAll();route()});

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
  if('close' in d||t.id==='ov'){closeAll();return}
  if(d.open){openP(d.open);return}
  if(d.wish){wish.has(d.wish)?wish.delete(d.wish):wish.add(d.wish);saveLocal();toast(wish.has(d.wish)?'Saved to wishlist':'Removed from wishlist');document.querySelectorAll(`[data-wish="${d.wish}"]`).forEach(b=>{b.classList.toggle('on',wish.has(d.wish));if(b.classList.contains('btn'))b.textContent=wish.has(d.wish)?'Wishlisted':'Wishlist'});if(F.mode==='wish'&&!$('#pm').classList.contains('open'))route(true);return}
  if(d.cat){const[g,c]=d.cat.split('|');F._fromCat=true;F.c=c;F.size='';F.col='';F.price='';const target='#'+g.toLowerCase();if(location.hash===target){F.g=g;route(true)}else location.hash=target;return}
  if(d.f){F[d.f]=d.v;if(d.f==='g')F.c='';F.shown=24;route(true);if(innerWidth<=860)$('#filters')?.classList.add('open');return}
  if(t.id==='ftog'){$('#filters').classList.toggle('open');return}
  if(t.id==='more'){F.shown+=24;route(true);return}
  if(t.id==='cartBtn'){renderCart();$('#cd').classList.add('open');$('#ov').classList.add('open');return}
  if(d.size){curSize=d.size;renderP();return}
  if(d.img){curImg=+d.img;renderP();return}
  if(d.q){curQty=Math.max(1,Math.min(10,curQty+ +d.q));renderP();return}
  if(t.id==='addBag'){if(!curSize){$('#szErr').textContent='Please select a size.';return}if(addToCart(cur.id,curSize,curQty)){toast('Added to bag');closeAll();renderCart();$('#cd').classList.add('open');$('#ov').classList.add('open')}return}
  if(d.cq){const[i,dq]=d.cq.split('|').map(Number);const c=cart[i];if(!c)return;const max=(BY[c.id]?.s||{})[c.size]||0;c.qty=Math.max(1,c.qty+dq);if(dq>0&&c.qty>max){c.qty=max||1;toast(`Only ${max} in stock`)}saveLocal();renderCart();return}
  if(d.rm){cart.splice(+d.rm,1);saveLocal();renderCart();return}
  if(d.atab){A.tab=d.atab;if(d.atab==='ord')loadAllOrders().then(admin).catch(()=>{});admin();return}
  if(d.outcat){const[g,c]=d.outcat.split(' › ');A.tab='prod';A.g=g;A.q=c;A.stock='out';admin();return}
  if(t.id==='amore'){A.shown+=50;admin();return}
  if(d.edit){if(isAdmin)openEdit(d.edit);return}
  if(t.id==='logout'){logout();return}
  if(t.id==='refresh'){t.disabled=true;Promise.all([loadCatalogue(),loadAllOrders()]).then(()=>{toast('Refreshed from the sheet');admin()}).catch(e=>{if(!authFail(e))toast(e.message);admin()});return}
  if(t.id==='addurl'){readEdit();const u=$('#phurl').value.trim();if(!/^https:\/\/\S+$/.test(u)){toast('Paste a link that starts with https://');return}E.photos.push({u,url:u});renderEdit();return}
  if(t.id==='instBtn'){installApp();return}
  if(t.id==='iosHint'){installApp(true);return}
  if(t.id==='iosOk'){$('#iosDlg').classList.remove('open');return}
  if(d.del){if(isAdmin)delProduct(d.del);return}
  if(d.rmph){readEdit();E.photos.splice(+d.rmph,1);renderEdit();return}
  if(d.cover){readEdit();const[x]=E.photos.splice(+d.cover,1);E.photos.unshift(x);renderEdit();return}
  if(d.rmsz){readEdit();delete E.p.s[d.rmsz];renderEdit();return}
  if(t.id==='addsz'){readEdit();const s=$('#newsz').value.trim();if(s&&!(s in E.p.s)){E.p.s[s]=0;renderEdit()}return}
});
$('#ov').onclick=closeAll;addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#srch').addEventListener('submit',e=>{e.preventDefault();F.q=$('#q').value.trim();F.g='';F.c='';F.size='';F.col='';F.price='';F.mode='';F.shown=24;if(location.hash==='#shop')route(true);else{F._fromCat=true;location.hash='#shop'}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sort'){F.sort=t.value;route(true)}else if(t.id==='fst'){F.stock=t.checked;route(true)}
  else if(t.id==='ag'){A.g=t.value;A.shown=50;admin()}else if(t.id==='as'){A.stock=t.value;A.shown=50;admin()}
  else if(t.dataset.ost){setOrderStatus(+t.dataset.ost,t.value)}
  else if(t.id==='phin'){uploadPhotos([...t.files])}
  else if(t.closest('#ef')&&['hex','t','pat'].includes(t.name)){readEdit();$('#prev').innerHTML=art(E.p)}
});
let aqT;document.addEventListener('input',e=>{if(e.target.id==='aq'){clearTimeout(aqT);aqT=setTimeout(()=>{A.q=e.target.value;A.shown=50;admin();const i=$('#aq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)}});
document.addEventListener('submit',e=>{if(e.target.id==='lgf'){e.preventDefault();login(e.target)}else if(e.target.id==='ckf'){e.preventDefault();placeOrder(e.target)}else if(e.target.id==='ef'){e.preventDefault();saveEdit()}});
function uploadPhotos(files){
  readEdit();
  for(const f of files){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(f.name+': use JPG, PNG or WebP');continue}if(f.size>25e6){toast(f.name+' is too large');continue}
    E.photos.push({file:f,url:URL.createObjectURL(f)})}
  renderEdit();
}
async function login(f){
  const v=Object.fromEntries(new FormData(f)),err=$('#lgErr'),b=f.querySelector('button');err.textContent='';b.disabled=true;b.textContent='Signing in…';
  try{const r=await api('login',{password:v.password},true);tok=r.token;ls.set('devo-tok',tok);sheetUrl=r.sheetUrl||'';ls.set('devo-sheet',sheetUrl);
    isAdmin=true;$('#admLink').hidden=false;await Promise.all([loadCatalogue(),loadAllOrders()]).catch(()=>{});admin();toast('Signed in')}
  catch(e){err.textContent=e.message;b.disabled=false;b.textContent='Sign in'}
}

/* ---------- install (PWA) ---------- */
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#instBtn').hidden=false});
addEventListener('appinstalled',()=>{deferred=null;$('#instBtn').hidden=true;toast('App installed')});
async function installApp(fromFooter){
  if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;$('#instBtn').hidden=true;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#iosMsg').textContent=matchMedia('(display-mode: standalone)').matches?'You are already using the installed app.':ios?'In Safari, tap the Share button, then “Add to Home Screen”.':'Open your browser menu (⋮) and choose “Install app” or “Add to Home screen”.';
  $('#iosDlg').classList.add('open');
}
/* Website demo: no offline cache, so visitors always get the current demo. */
function netNote(){$('#net').textContent=navigator.onLine?'':'You’re offline — showing saved products.'}
addEventListener('online',netNote);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&online&&!$('#am').classList.contains('open')&&!$('#pm').classList.contains('open')&&location.hash!=='#checkout')loadCatalogue().then(()=>route(true)).catch(()=>{})});addEventListener('offline',netNote);

/* ---------- boot ---------- */
counts();netNote();
function cacheCat(){ls.set('devo-cat',{t:Date.now(),p:BASE})}
// Customers get visible products; a signed-in admin also gets hidden ones.
async function loadCatalogue(){
  let r;
  if(isAdmin&&tok){try{r=await api('adminProducts',{},true)}catch(e){if(e.auth)logout();else throw e}}
  if(!r)r=await api('products');
  BASE=r.products;OV={};merge();cacheCat();
}
(async()=>{
  const cached=ls.get('devo-cat',null);
  if(cached&&cached.p&&cached.p.length){BASE=cached.p;merge();route()}
  if(!API){ // demo mode: no Google Sheet yet, use the bundled catalogue
    try{const r=await fetch('products.json');BASE=await r.json();merge();route()}catch(e){V.innerHTML='<div class="empty">The catalogue could not be loaded. Please refresh.</div>'}
    return;
  }
  if(tok)isAdmin=true;
  const shown=BASE.length>0;
  try{await loadCatalogue();online=true;route(shown)}
  catch(e){online=false;isAdmin=false;
    if(!BASE.length){V.innerHTML='<div class="empty">The store could not be reached. Check your internet connection and refresh.</div>'}
    return}
  if(isAdmin){$('#admLink').hidden=false;loadAllOrders().then(()=>{if(location.hash==='#admin')admin()}).catch(e=>{authFail(e)})}
})();
}
</script>
</body>
