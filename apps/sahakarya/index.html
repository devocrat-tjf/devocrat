<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2A6E">
<title>Sahakārya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Catamaran:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: sidebar + content on desktop; top bar + bottom tab bar on phone. Mandala motifs mark progress; kolam dot-rows divide sections. */
:root {
  --bg: #FBF5EA;
  --surface: #FFFDF8;
  --surface-2: #F4EADA;
  --ink: #24173A;
  --muted: #6D6180;
  --line: #E6D7BF;
  --saffron: #D46A12;
  --gold: #B5832A;
  --kumkum: #A82337;
  --teal: #1C716C;
  --indigo: #3B2A6E;
  --ok: #1C7E62;
  --on-accent: #FFFDF8;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 6px 20px rgba(60,40,20,.06);
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --font-body: "Catamaran", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-deva: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130D20; --surface: #1C1430; --surface-2: #261C3E; --ink: #F3EAD8; --muted: #A99DBB;
    --line: #3A2E55; --saffron: #F0913A; --gold: #D9AE55; --kumkum: #E5596E; --teal: #52B5AA;
    --indigo: #B9A6F2; --ok: #4CC29A; --on-accent: #1A1226; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130D20; --surface: #1C1430; --surface-2: #261C3E; --ink: #F3EAD8; --muted: #A99DBB;
  --line: #3A2E55; --saffron: #F0913A; --gold: #D9AE55; --kumkum: #E5596E; --teal: #52B5AA;
  --indigo: #B9A6F2; --ok: #4CC29A; --on-accent: #1A1226; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 1.85rem; line-height: 1.15; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
a { color: var(--teal); }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.deva { font-family: var(--font-deva); }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.kolam { height: 8px; background: radial-gradient(circle, var(--gold) 1.4px, transparent 2px) 0 50% / 14px 8px repeat-x; opacity: .55; border: 0; margin: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* shell */
.shell { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; gap: 6px; overflow: hidden; }
.side .wm { position: absolute; width: 360px; height: 360px; left: -110px; bottom: -150px; opacity: .13; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand .n1 { font-family: var(--font-display); font-size: 1.3rem; line-height: 1; }
.brand .n2 { font-family: var(--font-deva); font-size: .9rem; color: var(--gold); line-height: 1.2; }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; position: relative; }
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { background: var(--surface-2); color: var(--ink); }
.nav-btn.on::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 4px; background: var(--saffron); border-radius: 0 4px 4px 0; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative; }
.saved { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.saved i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-in { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.desk-top { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.topbar, .bottomnav { display: none; }
@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .side, .desk-top { display: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .brand { padding: 0; }
  .topbar .brand svg { width: 32px; height: 32px; }
  .main { padding-block: 16px 110px; }
  .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around; align-items: flex-end; }
  .bottomnav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--muted); padding: 4px 0; cursor: pointer; }
  .bottomnav button svg { width: 22px; height: 22px; }
  .bottomnav button.on { color: var(--saffron); }
  .bottomnav .fab { width: 54px; height: 54px; flex: none; border-radius: 50%; background: var(--saffron); color: var(--on-accent); box-shadow: var(--shadow); margin-top: -26px; justify-content: center; }
  .bottomnav .fab svg { width: 26px; height: 26px; }
  h1 { font-size: 1.55rem; }
}

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--gold); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--kumkum); border-color: color-mix(in srgb, var(--kumkum) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { padding: 5px 11px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.plain { border-color: transparent; background: none; width: 32px; height: 32px; }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--kumkum); color: #fff; font-size: .68rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
input[type=text], input[type=search], input[type=date], input[type=number], input[type=password], select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--saffron); box-shadow: 0 0 0 3px color-mix(in srgb, var(--saffron) 20%, transparent); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--saffron); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 75%, var(--ink)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); font-size: .75rem; color: var(--muted); }
.avatar { width: var(--s, 28px); height: var(--s, 28px); border-radius: 50%; background: var(--c); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: calc(var(--s, 28px) * .42); flex: none; box-shadow: 0 0 0 2px var(--surface); }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 90px; height: 90px; opacity: .5; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 20px; padding: 26px 24px; background: linear-gradient(135deg, var(--indigo), color-mix(in srgb, var(--indigo) 60%, var(--kumkum))); color: #FBF3E4; }
:root[data-theme="dark"] .hero { background: linear-gradient(135deg, #2C1F52, #4A1B33); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: linear-gradient(135deg, #2C1F52, #4A1B33); } }
.hero .m { position: absolute; right: -70px; top: -70px; width: 300px; height: 300px; opacity: .3; animation: spin 120s linear infinite; }
.hero h1 { color: #FFF6E6; }
.hero .sub { color: #E9DCC8; max-width: 52ch; }
.hero .row .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #FFF6E6; }
.hero .row .btn.primary { background: #F0913A; border-color: #F0913A; color: #1A1226; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .hero .m, .lock-m { animation: none !important; } }

/* stats */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; }
.stat:hover { border-color: var(--c); }
.stat .v { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; color: var(--c); }
.stat .k { font-size: .82rem; color: var(--muted); font-weight: 600; }
.stat::after { content: ""; position: absolute; right: -14px; bottom: -14px; width: 54px; height: 54px; border-radius: 50%; border: 2px dotted var(--c); opacity: .35; }
.grid2 { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
@media (max-width: 980px) { .grid2, .grid3 { grid-template-columns: minmax(0,1fr); } }

/* rows */
.list { display: flex; flex-direction: column; }
.trow { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.trow:last-child { border-bottom: 0; }
.trow:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.trow .pm { width: 42px; height: 42px; flex: none; }
.trow .t { font-weight: 600; }
.trow .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.due-over { color: var(--kumkum); font-weight: 600; }
.due-soon { color: var(--saffron); font-weight: 600; }
.ev { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.ev:last-child { border-bottom: 0; }
.note-list { display: flex; flex-direction: column; }
.note-row { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px dashed var(--line); padding: 12px 4px; cursor: pointer; border-radius: 0; min-width: 0; }
.note-row:last-child { border-bottom: 0; }
button.note-row:hover { background: var(--surface-2); }
.note-row.bad { cursor: default; }
.note-t { font-weight: 600; overflow-wrap: anywhere; }
.note-s { font-size: .86rem; color: var(--muted); white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.note-warn { border-left: 4px solid var(--gold); }
.linkish { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font-weight: 600; text-align: left; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--saffron)); border-radius: 4px; transition: width .4s; }

/* filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; flex: 1 1 130px; }
.filters input[type=search] { flex: 3 1 220px; width: auto; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col.drop { outline: 2px dashed var(--saffron); }
.col-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.bcard:hover { border-color: var(--gold); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .dow { font-size: .72rem; text-align: center; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 4px 0; }
.cal .day { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; text-align: left; }
.cal .day.out { opacity: .4; }
.cal .day.today { border-color: var(--saffron); box-shadow: inset 0 0 0 1px var(--saffron); }
.cal .day.sel { background: var(--surface-2); }
.cal .dn { font-size: .78rem; font-weight: 700; }
.cal .ci { font-size: .7rem; padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 18%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .dots { display: none; gap: 3px; flex-wrap: wrap; }
.cal .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
@media (max-width: 640px) { .cal .day { min-height: 54px; } .cal .ci { display: none; } .cal .dots { display: flex; } }

/* detail */
.detail { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .detail { grid-template-columns: minmax(0,1fr); } }
.prog { display: flex; align-items: center; gap: 18px; }
.prog .pm { width: 120px; height: 120px; flex: none; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.step.done { background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.step.done .stitle { text-decoration: line-through; color: var(--muted); }
.step .sno { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; background: var(--surface-2); flex: none; }
.step .stitle { border: 0; background: none; padding: 4px; flex: 1; min-width: 0; border-radius: 6px; }
.step .stitle:focus { background: var(--surface-2); box-shadow: none; }
.step input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--ok); flex: none; cursor: pointer; }
.step .sfiles { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.step .sbtns { display: contents; }
@media (max-width: 600px) {
  /* Phones: the step name gets the whole first line; who did it and the step buttons sit below. */
  .step { flex-wrap: wrap; row-gap: 0; }
  .step .stitle { flex: 1 0 calc(100% - 72px); }
  .step .sdone { margin-left: 62px; }
  .step .sbtns { margin-left: auto; display: flex; }
}
.metagrid { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px 14px; align-items: center; font-size: .9rem; }
.metagrid > span:nth-child(odd) { color: var(--muted); font-size: .82rem; }
.metagrid select { padding: 6px 10px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-color: var(--saffron); }
.banner { border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.comment .body { white-space: pre-wrap; word-break: break-word; }

/* files */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.drop.over { border-color: var(--saffron); background: color-mix(in srgb, var(--saffron) 8%, transparent); }
.frow { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.frow:last-child { border-bottom: 0; }
.ficon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: .62rem; font-weight: 800; letter-spacing: .03em; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 80%, var(--ink)); flex: none; text-transform: uppercase; }
.fchild { padding-left: 26px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(20,12,30,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; width: min(640px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; }
.modal.wide { width: min(900px, 100%); }
.modal-h { padding: 18px 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; }

  async del(id) { const db = await this.open(); if (!db) { this.mem.delete(id); return; } return new Promise(res => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(id); tx.oncomplete = res; tx.onerror = res; }); },

function pinPadHTML(id) {

function bindPinPad(root, id, onDone) {
  let v = '';

  const paint = () => $$('i', dotsEl).forEach((d, i) => d.classList.toggle('f', i < v.length));
  const push = k => {
    if (k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += k;
    paint();
    if (v.length === 4) { const val = v; setTimeout(async () => { const ok = await onDone(val); if (ok === false) { dotsEl.classList.remove('shake'); void dotsEl.offsetWidth; dotsEl.classList.add('shake'); } v = ''; paint(); }, 120); }
  };
  $('#' + id + '-pad', root).addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) push(b.dataset.k); });
  const kh = e => { if (!dotsEl.isConnected) { document.removeEventListener('keydown', kh); return; } if (/^\d$/.test(e.key)) push(e.key); else if (e.key === 'Backspace') push('del'); };

async function connectExisting(input) {

    D.sync = Object.assign(freshSync('google'), { url, key: j.claimed ? j.key : key, sheetUrl: j.sheetUrl, sheetName: j.sheetName });
    D.tasks.forEach(t => { D.sync.dirty.tasks[t.id] = 1; t.files.forEach(f => { if (!f.driveId && !D.local.toUpload.includes(f.id)) D.local.toUpload.push(f.id); }); });
    D.users.forEach(u => { D.sync.dirty.users[u.id] = 1; });

  if (!ok) return;

  Object.assign(D.sync, { url, key, sheetUrl: j.sheetUrl, sheetName: j.sheetName });

  await Sync.run();
  lock('joined a shared workspace');
}

function filtered() {
  const q = F.q.toLowerCase();
  let ts = D.tasks.filter(t => {
    if (!F.showArchived && roleOf(t) === 'archived' && F.status !== 'role:archived' && F.status !== t.status) return false;
    if (F.owner && t.ownerId !== F.owner) return false;
    if (F.status) { if (F.status.startsWith('role:')) { if (roleOf(t) !== F.status.slice(5)) return false; } else if (t.status !== F.status) return false; }
    if (F.priority && t.priority !== F.priority) return false;
    if (F.category && t.category !== F.category) return false;
    if (F.tag && !t.tags.includes(F.tag)) return false;
    if (F.due === 'over' && dueState(t) !== 'over') return false;
    if (F.due === 'soon' && dueState(t) !== 'soon') return false;
    if (F.due === 'none' && t.dueDate) return false;
    if (q && ![t.title, t.desc, t.category, ...t.tags, ...Object.values(t.custom || {}), ...t.steps.map(s => s.title)].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  const pr = id => D.settings.priorities.findIndex(p => p.id === id);
  const sorters = {
    due: (a, b) => (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : 0,
    priority: (a, b) => pr(b.priority) - pr(a.priority),
    updated: (a, b) => b.updatedAt - a.updatedAt,
    progress: (a, b) => progress(a) - progress(b),
    title: (a, b) => a.title.localeCompare(b.title),
  };
  return ts.sort(sorters[F.sort] || sorters.due);
}

      <section class="card">

function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

/* --- files --- */
const EXT_COL = { pdf: '#A82337', doc: '#2E6BB0', docx: '#2E6BB0', xls: '#1C7E62', xlsx: '#1C7E62', csv: '#1C7E62', ppt: '#D46A12', pptx: '#D46A12', zip: '#8A6A12', rar: '#8A6A12', '7z': '#8A6A12', mp4: '#7A3FA0', mov: '#7A3FA0', mp3: '#B04A82', wav: '#B04A82', apk: '#3C8A3A' };
const extOf = n => (n.includes('.') ? n.split('.').pop().toLowerCase() : '').slice(0, 4);
function fileIcon(f) {
  const e = extOf(f.name), img = (f.type || '').startsWith('image/');
  return `<span class="ficon" style="--c:${img ? '#1C716C' : EXT_COL[e] || '#6D6180'}">${esc(img ? 'img' : e || 'file')}</span>`;
}
function canDelete(f) { return D.settings.fileDelete === 'anyone' || f.uploaderId === S.me; }
function fileRows(t, files, showTask = false) {
  const groups = [], seen = {};
  files.forEach(f => {
    if (f.folderId) { if (!seen[f.folderId]) { seen[f.folderId] = { folder: true, id: f.folderId, name: f.folderName, files: [], t: f.task || t }; groups.push(seen[f.folderId]); } seen[f.folderId].files.push(f); }
    else groups.push({ folder: false, f });
  });
  const stepName = (tk, id) => { const s = tk.steps.find(x => x.id === id); return s ? 'Step: ' + s.title : ''; };
  const fileLine = (f, tk, child) => `<div class="frow ${child ? 'fchild' : ''}">${fileIcon(f)}
    <div class="grow" style="min-width:0"><div class="ell" title="${esc(f.path || f.name)}">${esc(child ? (f.path || f.name).split('/').slice(1).join('/') : f.name)}</div>
    <div class="tiny muted ell">${synced() && !f.driveId ? '<span class="due-soon">Not in Drive yet</span> · ' : ''}${fmtSize(f.size)} · ${esc(uname(f.uploaderId))} · ${ago(f.at)}${f.stepId ? ' · ' + esc(stepName(tk, f.stepId)) : ''}${showTask && !child ? ` · <button class="linkish" data-act="open" data-id="${tk.id}">${esc(tk.title)}</button>` : ''}</div></div>
    <button class="icon-btn plain" data-act="preview" data-t="${tk.id}" data-f="${f.id}" aria-label="Preview">${ic('eye')}</button>
    <button class="icon-btn plain" data-act="download" data-t="${tk.id}" data-f="${f.id}" aria-label="Download">${ic('dl')}</button>
    <button class="icon-btn plain" data-act="delFile" data-t="${tk.id}" data-f="${f.id}" ${canDelete(f) ? '' : 'disabled title="Only the uploader can delete this file"'} aria-label="Delete">${ic('trash')}</button></div>`;
  return groups.map(g => {
    if (!g.folder) return fileLine(g.f, g.f.task || t, false);
    const open = S.openFolders.has(g.id), size = g.files.reduce((s, f) => s + f.size, 0), tk = g.t;
    return `<div class="frow"><span class="ficon" style="--c:var(--gold)">${ic('folder', 'style="width:18px;height:18px"')}</span>
      <button class="grow linkish" style="color:var(--ink);min-width:0" data-act="toggleFolder" data-id="${g.id}"><div class="ell">${open ? '▾' : '▸'} ${esc(g.name)}</div><div class="tiny muted ell" style="font-weight:400">Folder · ${g.files.length} files · ${fmtSize(size)} · ${esc(uname(g.files[0].uploaderId))}${showTask ? ' · ' + esc(tk.title) : ''}</div></button>
      <button class="icon-btn plain" data-act="dlFolder" data-t="${tk.id}" data-id="${g.id}" aria-label="Download folder as zip">${ic('dl')}</button>
      <button class="icon-btn plain" data-act="delFolder" data-t="${tk.id}" data-id="${g.id}" ${g.files.every(canDelete) ? '' : 'disabled'} aria-label="Delete folder">${ic('trash')}</button></div>
      ${open ? g.files.map(f => fileLine(f, tk, true)).join('') : ''}`;
  }).join('');
}
function filesPanel(t) {
  return `<div class="drop" data-dropzone="${t.id}">${ic('clip', 'style="width:28px;height:28px"')}
      <div><b>Drop files or folders here</b><div class="small">Any file type · up to ${D.settings.maxFileMB} MB each</div></div>
      <div class="row wrap" style="justify-content:center"><button class="btn primary sm" data-act="pickFiles">${ic('file')} Choose files</button><button class="btn sm" data-act="pickFolder">${ic('folder')} Choose folder</button>
      <select id="up-step" style="width:auto" aria-label="Attach to step"><option value="">Attach to activity</option>${t.steps.map((s, i) => `<option value="${s.id}">Step ${i + 1}: ${esc(s.title)}</option>`).join('')}</select></div></div>
    <div style="margin-top:10px">${t.files.length ? fileRows(t, t.files) : '<p class="muted small">No files yet. Photos, PDFs, spreadsheets, whole folders: everything is visible to both of you.</p>'}</div>`;
}
VIEWS.files = () => {
  let all = D.tasks.flatMap(t => t.files.map(f => ({ ...f, task: t }))).sort((a, b) => b.at - a.at);
  const q = S.filesQ.toLowerCase();
  if (q) all = all.filter(f => (f.path || f.name).toLowerCase().includes(q) || f.task.title.toLowerCase().includes(q));
  const kinds = { image: f => (f.type || '').startsWith('image/'), pdf: f => extOf(f.name) === 'pdf', doc: f => ['doc', 'docx', 'xls', 'xlsx', 'csv', 'ppt', 'pptx', 'txt', 'odt'].includes(extOf(f.name)), media: f => /^(video|audio)\//.test(f.type || ''), other: f => true };
  if (S.filesType) all = all.filter(kinds[S.filesType]);
  const total = D.tasks.reduce((s, t) => s + t.files.reduce((a, f) => a + f.size, 0), 0);
  // group by task, keep folder grouping
  const byTask = {}; all.forEach(f => (byTask[f.task.id] = byTask[f.task.id] || []).push(f));
  return `<div class="row between wrap"><div><h1>Files &amp; evidence</h1><p class="muted num" style="margin:2px 0 0">${D.tasks.reduce((s, t) => s + t.files.length, 0)} files · ${fmtSize(total)} stored on this device</p></div><button class="btn primary" data-act="quickUpload">${ic('clip')} Upload evidence</button></div>
  <div class="filters"><input type="search" placeholder="Search file names or activities" value="${esc(S.filesQ)}" data-input="filesQ" id="files-q">
    <select data-change="filesType" aria-label="File type"><option value="">All types</option>${[['image', 'Images'], ['pdf', 'PDFs'], ['doc', 'Documents & sheets'], ['media', 'Audio & video']].map(([v, l]) => `<option value="${v}" ${S.filesType === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  ${Object.keys(byTask).length ? Object.entries(byTask).map(([tid, fs]) => { const t = D.tasks.find(x => x.id === tid); return `<section class="card"><div class="card-h"><button class="linkish" style="font-size:1.05rem" data-act="open" data-id="${t.id}">${esc(t.title)}</button>${statusPill(t)}</div>${fileRows(t, fs)}</section>`; }).join('') : `<div class="card">${emptyState(q || S.filesType ? 'No files match.' : 'No files yet. Use “Upload evidence” to attach files or whole folders to an activity.')}</div>`}`;
};

/* ============ note pad ============
   Notes are shared by everyone and encrypted on the phone with one common passcode
   (PBKDF2 -> AES-GCM). The Sheet and the backups only ever hold scrambled text.
   Shared settings keep a "vault": a salt plus a check value encrypted with the passcode,
   so a phone can tell whether a typed passcode is right. The passcode itself is never stored. */
const NOTE_ITER = 250000, NOTE_CHECK = 'sahakarya-notes';
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(x => { s += String.fromCharCode(x); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Notes = {
  key: null, kid: null, plain: new Map(), bad: new Set(), busy: false, again: false, fails: 0, waitUntil: 0,
  vault: () => D && D.settings.notesVault,
  open() { const v = this.vault(); return !!(this.key && v && this.kid === v.kid); },
  live: () => D.notes.filter(n => !n.deleted),
  forget() { this.key = null; this.kid = null; this.plain.clear(); this.bad.clear(); },
  async derive(code, salt, iter = NOTE_ITER) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(salt), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async enc(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  },
  async dec(key, iv, ct) { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct)))); },
  async makeVault(code) {
    const salt = b64(crypto.getRandomValues(new Uint8Array(16))), kid = uid('nk');
    const key = await this.derive(code, salt);
    const c = await this.enc(key, { check: NOTE_CHECK, kid });
    return { vault: { kid, salt, iter: NOTE_ITER, iv: c.iv, check: c.ct, by: S.me, at: Date.now() }, key };
  },
  /* Returns the key if the passcode is right, otherwise null. */
  async tryCode(code) {
    const v = this.vault(); if (!v) return null;
    try { const key = await this.derive(code, v.salt, v.iter || NOTE_ITER); const o = await this.dec(key, v.iv, v.check); return o && o.check === NOTE_CHECK ? key : null; }
    catch (e) { return null; }
  },
  async decryptAll() {
    if (!this.open()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; let did = false;
    try {
      for (const n of this.live()) {
        if (this.plain.has(n.iv) || this.bad.has(n.iv)) continue;
        did = true;
        if (n.kid !== this.kid) { this.bad.add(n.iv); continue; }
        try { this.plain.set(n.iv, await this.dec(this.key, n.iv, n.ct)); } catch (e) { this.bad.add(n.iv); }
      }
    } finally { this.busy = false; }
    if (this.again) { this.again = false; return this.decryptAll(); }
    if (did && S.view === 'notes') softRender();
  },
  /* Encrypts and stores a note with the current passcode. Creates it when n is null. */
  async write(n, title, body) {
    const v = this.vault(), now = Date.now();
    const c = await this.enc(this.key, { title, body });
    if (!n) { n = { id: uid('n'), createdBy: S.me, createdAt: now, rev: 0 }; D.notes.unshift(n); }
    if (n.iv) this.plain.delete(n.iv);
    Object.assign(n, { kid: v.kid, salt: v.salt, iv: c.iv, ct: c.ct, updatedBy: S.me, updatedAt: now, deleted: false });
    this.plain.set(c.iv, { title, body });
    markNote(n);
    return n;
  },
  remove(n) { this.plain.delete(n.iv); Object.assign(n, { deleted: true, iv: '', ct: '', updatedBy: S.me, updatedAt: Date.now() }); markNote(n); },
};
const wireNote = n => ({ id: n.id, kid: n.kid || '', salt: n.salt || '', iv: n.iv || '', ct: n.ct || '', createdBy: n.createdBy, createdAt: n.createdAt, updatedBy: n.updatedBy, updatedAt: n.updatedAt, deleted: !!n.deleted });
const passField = (id, label, extra = '') => `<label class="field"><span>${label}</span><input type="password" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" ${extra}></label>`;
function codeProblem(a, b) {
  if (a.length < 6) return 'Use at least 6 characters.';
  if (a !== b) return 'The two passcodes don’t match.';
  return '';
}

function submitTask(form) {
  const v = id => $('#' + id, form)?.value ?? '';

  const owner = $('input[name=tf-owner]:checked', form)?.value || S.me;
  const custom = {}; $$('[data-cf]', form).forEach(i => { if (i.value) custom[i.dataset.cf] = i.value; });

    const keep = D.local.prefs; D = seed(); D.local.prefs = keep; save(); lock('demo reset');
  },
};
function userModal(u) {

    <div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">${isNew ? 'Add person' : 'Save'}</button></div></form>`);
  $('#uf-colors', el).addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; color = b.dataset.c; $$('.color-dot', el).forEach(x => x.classList.toggle('on', x === b)); });

    else { const old = u.name; u.name = name; u.color = color; markUser(u); log(old !== name ? `renamed ${old} to ${name}` : `updated ${name}’s colour`); }

/* ---------- note pad actions ---------- */
async function notesSetup(f) {
  const a = $('#ns-a', f).value, b = $('#ns-b', f).value, err = $('#ns-err', f), btn = $('#ns-go', f);
  const bad = codeProblem(a, b); if (bad) { err.textContent = bad; return; }
  if (Notes.vault()) { render(); return toast(`${uname(Notes.vault().by)} already set a passcode. Ask them for it.`, 'err'); }
  btn.disabled = true; btn.textContent = 'Setting up…';
  const { vault, key } = await Notes.makeVault(a);
  if (Notes.vault()) { render(); return toast('A passcode was set on another phone meanwhile. Ask for it.', 'err'); }
  Notes.key = key; Notes.kid = vault.kid;
  changeSettings('set up the note pad passcode', s => { s.notesVault = vault; });
}
async function notesUnlock(f) {
  const code = $('#nu-code', f).value, err = $('#nu-err', f), btn = $('#nu-go', f);
  if (!code) return;
  const wait = Math.ceil((Notes.waitUntil - Date.now()) / 1000);
  if (wait > 0) { err.textContent = `Too many wrong tries. Wait ${wait} seconds.`; return; }
  btn.disabled = true; btn.textContent = 'Checking…';
  const key = await Notes.tryCode(code);
  if (!key) {
    Notes.fails++;
    if (Notes.fails >= 5) { Notes.fails = 0; Notes.waitUntil = Date.now() + 30000; log('entered a wrong note pad passcode 5 times'); save(); }
    btn.disabled = false; btn.textContent = 'Open note pad';
    err.textContent = 'That passcode is not right.'; $('#nu-code', f).select(); return;
  }
  Notes.fails = 0; Notes.key = key; Notes.kid = Notes.vault().kid;
  log('opened the note pad'); save(); render();
}
Object.assign(A, {
  newNote: () => Notes.open() && noteEditor(null),
  openNote: d => { const n = D.notes.find(x => x.id === d.id); if (n && Notes.open()) noteEditor(n); },
  notesLock: () => { Notes.forget(); render(); },
  dropNote: async d => {
    const n = D.notes.find(x => x.id === d.id); if (!n) return;
    if (!await confirmBox({ title: 'Delete this note?', text: 'It can’t be read with the current passcode. It will be removed for everyone.', ok: 'Delete for everyone', danger: true })) return;
    if (!await guard('Deleting a note removes it for everyone.')) return;
    Notes.remove(n); log('deleted a note', null, [n.createdBy]); save(); render();
  },
  rescueNote: d => {
    const n = D.notes.find(x => x.id === d.id); if (!n) return;
    const el = openModal(`${mHead('Open with the old passcode')}<form><div class="modal-b"><p class="small muted" style="margin:0">Type the passcode that was in use before it was changed. The note is then saved again with the current passcode.</p>${passField('nr-code', 'Old passcode', 'autofocus')}<p class="small due-over" id="nr-err" style="margin:0"></p></div>
      <div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="nr-go">Open</button></div></form>`);
    el.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); e.stopPropagation();
      const code = $('#nr-code', el).value, btn = $('#nr-go', el); if (!code) return;
      btn.disabled = true; btn.textContent = 'Checking…';
      const key = await Notes.derive(code, n.salt).catch(() => null);
      // Move every note saved with that same old passcode in one go.
      const same = Notes.live().filter(x => x.salt === n.salt && Notes.bad.has(x.iv));
      let moved = 0;
      for (const x of same) { try { const p = await Notes.dec(key, x.iv, x.ct); Notes.bad.delete(x.iv); await Notes.write(x, p.title || '', p.body || ''); moved++; } catch (er) {} }
      if (!moved) { btn.disabled = false; btn.textContent = 'Open'; $('#nr-err', el).textContent = 'That passcode doesn’t open this note.'; return; }
      log(`moved ${moved} note${moved === 1 ? '' : 's'} to the current passcode`); save(); closeModal(); render();
      toast(`${moved} note${moved === 1 ? '' : 's'} moved to the current passcode`);
    });
  },
  notesChangeCode: () => {
    const el = openModal(`${mHead('Change the common passcode')}<form><div class="modal-b">
      <p class="small muted" style="margin:0">This changes the passcode for everyone. Tell the others the new one.</p>
      ${passField('nc-old', 'Current passcode', 'autofocus')}${passField('nc-a', 'New passcode (at least 6 characters)')}${passField('nc-b', 'Type the new one again')}
      <p class="small due-over" id="nc-err" style="margin:0"></p></div>
      <div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="nc-go">Change passcode</button></div></form>`);
    el.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); e.stopPropagation();
      const err = $('#nc-err', el), btn = $('#nc-go', el), a = $('#nc-a', el).value;
      const bad = codeProblem(a, $('#nc-b', el).value); if (bad) { err.textContent = bad; return; }
      btn.disabled = true; btn.textContent = 'Re-encrypting…';
      if (!await Notes.tryCode($('#nc-old', el).value)) { btn.disabled = false; btn.textContent = 'Change passcode'; err.textContent = 'The current passcode is not right.'; return; }
      await Notes.decryptAll();
      const { vault, key } = await Notes.makeVault(a);
      // Encrypt everything first, then switch over in one step so a failure leaves the old passcode working.
      const redo = [];
      for (const n of Notes.live()) { const p = Notes.plain.get(n.iv); if (p) redo.push({ n, p, c: await Notes.enc(key, p) }); }
      Notes.plain.clear();
      redo.forEach(({ n, p, c }) => { Object.assign(n, { kid: vault.kid, salt: vault.salt, iv: c.iv, ct: c.ct }); Notes.plain.set(c.iv, p); markNote(n); });
      Notes.key = key; Notes.kid = vault.kid;
      closeModal();
      changeSettings('changed the note pad passcode', s => { s.notesVault = vault; });
    });
  },
  notesReset: async () => {
    const n = Notes.live().length;
    if (!await confirmBox({ title: 'Wipe the note pad?', text: `Without the passcode the notes can’t be read by anyone. Wiping deletes <b>all ${n} note${n === 1 ? '' : 's'} for everyone</b> and removes the passcode so a new one can be set. This can’t be undone.`, ok: 'Wipe for everyone', danger: true })) return;
    if (!await askPin('Wiping the note pad deletes every note for everyone.')) return;
    Notes.live().forEach(x => Notes.remove(x));
    Notes.forget();
    changeSettings('wiped the note pad and removed its passcode', s => { s.notesVault = null; });
  },
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.notifOpen && !e.target.closest('.notif')) { S.notifOpen = false; render(); } return; }
  if (el.closest('#lock')) return;

  e.preventDefault();
  if (el.dataset.act !== 'toggleNotif' && el.dataset.act !== 'markSeen' && S.notifOpen && !el.closest('.notif')) S.notifOpen = false;

document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change, t = curTask();
  const C = {
    filter: () => { F[el.dataset.k] = el.value; P.filters = F; savePrefs(); render(); },
    archived: () => { F.showArchived = el.checked; P.filters = F; savePrefs(); render(); },
    filesType: () => { S.filesType = el.value; render(); },
    auditWho: () => { S.auditWho = el.value; render(); },
    toggleStep: () => {

      touch(t, `${s.done ? 'completed' : 'reopened'} step “${s.title}”`);
      if (s.done && ['open', 'draft'].includes(roleOf(t)) && firstStatus('active')) { t.status = firstStatus('active').id; mark(t, 'status'); touch(t, `changed status to ${firstStatus('active').name}`); }

    },

    workflowFree: () => { t.workflowFree = el.checked; mark(t, 'workflowFree'); touch(t, el.checked ? 'marked that no steps are needed' : 'turned step tracking back on'); save(); render(); },
    owner: () => { setOwner(t, el.value); save(); render(); },
    status: () => setStatus(t, el.value),
    priority: () => { t.priority = el.value; mark(t, 'priority'); touch(t, `set priority to ${prioOf(t).name}`); save(); render(); },
    setColor: () => { const it = D.settings[el.dataset.kind][el.dataset.i]; changeSettings(`changed the colour of “${it.name}”`, s => { s[el.dataset.kind][el.dataset.i].color = el.value; }); },
    setName: () => { const it = D.settings[el.dataset.kind][el.dataset.i], v = el.value.trim(); if (!v || v === it.name) return; changeSettings(`renamed “${it.name}” to “${v}”`, s => { s[el.dataset.kind][el.dataset.i].name = v; }); },
    setRole: () => { const it = D.settings.statuses[el.dataset.i]; changeSettings(`set “${it.name}” to behave as ${ROLES[el.value]}`, s => { s.statuses[el.dataset.i].role = el.value; }); },
    cfName: () => { const cf = D.settings.customFields[el.dataset.i], v = el.value.trim(); if (!v || v === cf.name) return; changeSettings(`renamed field “${cf.name}” to “${v}”`, s => { s.customFields[el.dataset.i].name = v; }); },
    cfType: () => changeSettings(`changed field “${D.settings.customFields[el.dataset.i].name}” to ${el.value}`, s => { s.customFields[el.dataset.i].type = el.value; }),
    sec: () => { const key = el.dataset.k, v = ['lockMinutes', 'maxFileMB', 'dueSoonDays'].includes(key) ? Number(el.value) : el.value; changeSettings(`set ${({ lockMinutes: 'auto-lock', fileDelete: 'file deletion rule', maxFileMB: 'max file size', dueSoonDays: '“due soon” window' })[key]} to ${el.selectedOptions[0].text}`, s => { s[key] = v; }); },
    secB: () => { const key = el.dataset.k; changeSettings(`${el.checked ? 'turned on' : 'turned off'} “${el.closest('label').textContent.trim()}”`, s => { s[key] = el.checked; }); },
  };
  C[k] && C[k]();
});
let searchTimer;

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;

/* drag & drop: board cards and file drop zones */
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (c) { e.dataTransfer.setData('text/x-task', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });

  const col = e.target.closest?.('[data-drop]'), dz = e.target.closest?.('[data-dropzone]');
  if (col && e.dataTransfer.types.includes('text/x-task')) { e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); }
  else if (dz && e.dataTransfer.types.includes('Files')) { e.preventDefault(); dz.classList.add('over'); }
});
document.addEventListener('dragleave', e => { const dz = e.target.closest?.('[data-dropzone]'); if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('over'); });
document.addEventListener('drop', async e => {
  const col = e.target.closest?.('[data-drop]'), dz = e.target.closest?.('[data-dropzone]');

});

/* Android back button: close what is open, then step back towards Home. */
window.skBack = () => {
