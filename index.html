<body>
<div id="cursor"><div class="cursor-core" id="cursorCore"></div></div><div id="fx"></div>
<main id="universe" aria-label="DEVOCRAT Universe">
  <canvas id="uniCanvas" aria-hidden="true"></canvas>
  <p class="uni-loading" id="uniLoading">Loading the universe…</p>
  <div class="nojs-msg"><span class="w-logo" role="img" aria-label="DEVOCRAT"></span><p>This is a preview without JavaScript. Open the page in a web browser — Safari, Chrome, Edge or Firefox — to explore the DEVOCRAT Universe.</p></div>
  <div class="intro" aria-live="polite">
    <p class="intro-line intro-hoi" id="introHoi">Hoi</p>
    <div class="intro-line intro-welcome" id="introWelcome"><span class="w-to">Welcome to</span><span class="w-logo" role="img" aria-label="DEVOCRAT"></span><span class="w-uni">Universe</span></div>
  </div>
  <div class="planet-label" id="planetLabel" aria-hidden="true"><small></small><strong></strong><span></span><em></em></div>
  <nav class="planet-nav" id="planetNav" aria-label="Worlds of the DEVOCRAT Universe"></nav>
  <p class="uni-hint" id="uniHint"></p>
  <div class="uni-fallback" id="uniFallback" hidden><span class="w-logo fb-logo" role="img" aria-label="DEVOCRAT"></span><p>The 3D universe couldn’t start on this device or connection. Choose a world:</p><div class="fb-grid" id="fbGrid"></div></div>
</main>
<div id="worldView" aria-hidden="true" role="dialog" aria-modal="true" aria-label="DEVOCRAT world"></div>
<div id="themeObjects" aria-hidden="true"></div>

<script src="js/content.js"></script>
<script src="js/languages.js"></script>
<script src="js/app.js"></script>
<script src="js/effects.js"></script>
<script src="js/universe-fallback.js"></script>
<!-- polyfills import maps for Safari before 16.4 (inactive where they are supported) -->
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="js/universe.js" onerror="showUniverseFallback()"></script>
</body>
</html>
